<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NX-Karten</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: rgba(255,255,255,.92);
      --panel-strong: #ffffff;
      --text: #1f2328;
      --muted: #5f6368;
      --line: #dfe3e8;
      --accent: #1a73e8;
      --shadow: 0 8px 24px rgba(0,0,0,.18);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text);
    }
    #map {
      position: fixed; inset: 0;
      background: #dfe9f3;
    }
    .top {
      position: fixed; top: 12px; left: 12px; right: 12px; max-width: 440px; z-index: 1000;
    }
    .search {
      display: flex; align-items: center; gap: 10px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow); padding: 0 14px; height: 48px;
    }
    .search span { color: var(--muted); font-size: 13px; }
    .search input {
      flex: 1; border: none; background: transparent; outline: none; font: inherit; color: var(--text);
    }
    .list {
      display: none; background: var(--panel-strong); border: 1px solid var(--line); border-radius: 16px; margin-top: 8px; box-shadow: var(--shadow); max-height: 50vh; overflow: auto;
    }
    .list.on { display: block; }
    .row {
      display: block; width: 100%; text-align: left; background: transparent; border: 0; color: var(--text); cursor: pointer; padding: 10px 14px; border-bottom: 1px solid #eef1f4;
    }
    .row:last-child { border-bottom: 0; }
    .row b { display: block; font-size: 14px; }
    .row small { display: block; color: var(--muted); margin-top: 2px; }
    .fabs {
      position: fixed; right: 14px; bottom: 18px; z-index: 1000; display: flex; flex-direction: column; gap: 10px;
    }
    .fab {
      width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--panel-strong); box-shadow: var(--shadow); font-size: 20px; cursor: pointer;
    }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; background: var(--panel); border-radius: 24px 24px 0 0; border: 1px solid var(--line); box-shadow: var(--shadow); transform: translateY(110%); transition: transform .25s ease; z-index: 1001; padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
    }
    .sheet.on { transform: translateY(0); }
    .sheet h2 {
      margin: 0 30px 6px 0; font-size: 1.35rem;
    }
    .sheet p {
      margin: 0 0 12px; color: var(--muted); font-size: 0.95rem;
    }
    .x {
      position: absolute; top: 12px; right: 12px; border: 0; background: transparent; font-size: 26px; cursor: pointer; color: var(--muted);
    }
    .acts {
      display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0;
    }
    .btn {
      cursor: pointer; border: 1px solid var(--line); background: #f1f3f4; color: var(--text); border-radius: 999px; padding: 9px 14px; font: inherit;
    }
    .btn.primary {
      background: var(--accent); border-color: var(--accent); color: white;
    }
    .btn[aria-pressed="true"] {
      background: var(--accent); border-color: var(--accent); color: white;
    }
    .eta {
      display: none; margin-top: 10px; border-top: 1px solid var(--line); padding-top: 12px;
    }
    .eta.on { display: block; }
    .eta b { font-size: 1.3rem; }
    .legs {
      margin-top: 8px; max-height: 24vh; overflow: auto; color: var(--muted); font-size: 13px;
    }
    .choices {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-top: 8px;
    }
    .choice {
      white-space: nowrap; border: 1px solid var(--line); background: #f1f3f4; border-radius: 14px; padding: 8px 10px; text-align: left; cursor: pointer; min-width: 130px;
    }
    .choice[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .choice b { display: block; }
    .choice small { color: var(--muted); }
    @media (max-width: 480px) {
      .top { left: 10px; right: 10px; }
      .search { height: 46px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="top">
    <div class="search">
      <span aria-hidden="true">Suchen</span>
      <input id="q" type="search" placeholder="Ort oder Adresse suchen" aria-label="Suche" />
    </div>
    <div class="list" id="list"></div>
  </div>

  <div class="fabs" id="fabs">
    <button class="fab" id="sat" title="Satellit ein/aus" aria-label="Satellit ein/aus">🛰</button>
    <button class="fab" id="street" title="Street View" aria-label="Street View">👁</button>
    <button class="fab" id="loc" title="Mein Standort" aria-label="Mein Standort">◎</button>
  </div>

  <div class="sheet" id="sheet" role="dialog" aria-live="polite">
    <button class="x" id="close" aria-label="Schließen">×</button>
    <h2 id="sn">Ort</h2>
    <p id="sd">Adresse</p>

    <div class="acts" aria-label="Verkehrsmittel auswählen">
      <button class="btn" data-m="car" aria-pressed="true">Auto</button>
      <button class="btn" data-m="bike" aria-pressed="false">Rad</button>
      <button class="btn" data-m="foot" aria-pressed="false">Zu Fuß</button>
      <button class="btn" data-m="opnv" aria-pressed="false">ÖPNV</button>
    </div>

    <div class="acts">
      <button class="btn primary" id="go">Route starten</button>
    </div>

    <div class="eta" id="eta">
      <b id="et"></b> <span id="ed" style="color: var(--muted);"></span>
      <div class="choices" id="choices"></div>
      <div class="legs" id="legs"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script>
    var map = L.map('map', { zoomControl: false }).setView([51.45, 6.8], 10);
    L.control.zoom({ position: 'bottomleft' }).addTo(map);

    var osm = L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap-Mitwirkende'
    }).addTo(map);

    var satGroup = L.layerGroup([
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Bilder &copy; Esri' }),
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 })
    ]);

    var sat = false;
    document.getElementById('sat').onclick = function () {
      sat = !sat;
      if (sat) {
        map.removeLayer(osm);
        satGroup.addTo(map);
      } else {
        map.removeLayer(satGroup);
        osm.addTo(map);
      }
    };

    var target = null;
    var me = null;
    var mark = null;
    var meMark = null;
    var route = null;
    var routeRequestId = 0;
    var mode = 'car';
    var transitJourneys = [];
    var nextTransitCursor = '';

    function esc(str) {
      return String(str).replace(/[&<>"']/g, function (c) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }

    function clearRoute() {
      if (route) { map.removeLayer(route); route = null; }
      document.getElementById('legs').innerHTML = '';
      document.getElementById('choices').innerHTML = '';
    }

    function formatDuration(seconds) {
      var mins = Math.max(1, Math.round(Number(seconds || 0) / 60));
      if (mins < 60) return mins + ' Min.';
      var h = Math.floor(mins / 60);
      var m = mins % 60;
      return h + ' Std. ' + m + ' Min.';
    }

    function decodePolyline(str, precision) {
      var points = [], index = 0, lat = 0, lng = 0, factor = Math.pow(10, precision || 6);
      while (index < str.length) {
        var shift = 0, result = 0, b;
        do {
          if (index >= str.length) return points;
          b = str.charCodeAt(index++) - 63;
          result |= (b & 31) << shift;
          shift += 5;
        } while (b >= 32);
        lat += (result & 1) ? ~(result >> 1) : (result >> 1);

        shift = 0; result = 0;
        do {
          if (index >= str.length) return points;
          b = str.charCodeAt(index++) - 63;
          result |= (b & 31) << shift;
          shift += 5;
        } while (b >= 32);
        lng += (result & 1) ? ~(result >> 1) : (result >> 1);
        points.push([lat / factor, lng / factor]);
      }
      return points;
    }

    function openStreetView() {
      var point = target || [map.getCenter().lat, map.getCenter().lng];
      window.open('https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=' + encodeURIComponent(point[0] + ',' + point[1]), '_blank', 'noopener,noreferrer');
    }
    document.getElementById('street').onclick = openStreetView;

    function show(lat, lon, name, bounds) {
      target = [lat, lon];
      if (mark) map.removeLayer(mark);
      mark = L.marker(target).addTo(map);
      var parts = String(name).split(', ');
      document.getElementById('sn').textContent = parts[0] || 'Ort';
      document.getElementById('sd').textContent = parts.slice(1, 5).join(', ') || 'Adresse';
      document.getElementById('sheet').classList.add('on');
      document.getElementById('fabs').classList.add('up');
      if (bounds) {
        map.fitBounds([[+bounds[0], +bounds[2]], [+bounds[1], +bounds[3]]], { maxZoom: 17, paddingBottomRight: [0, 220] });
      } else {
        map.setView(target, 16);
      }
    }

    var q = document.getElementById('q');
    var list = document.getElementById('list');
    var tm = null;

    q.addEventListener('input', function () {
      clearTimeout(tm);
      var text = q.value.trim();
      if (text.length < 2) { list.classList.remove('on'); return; }
      tm = setTimeout(function () { search(text); }, 400);
    });

    q.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        var first = list.querySelector('button');
        if (first) first.click();
      }
    });

    function search(term) {
      fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=7&accept-language=de&q=' + encodeURIComponent(term))
        .then(function (r) { if (!r.ok) throw new Error('search failed'); return r.json(); })
        .then(function (rows) {
          list.innerHTML = '';
          if (!rows.length) { list.innerHTML = '<div class="row"><b>Keine Treffer</b></div>'; }
          rows.forEach(function (p) {
            var b = document.createElement('button');
            b.className = 'row';
            var parts = String(p.display_name).split(', ');
            b.innerHTML = '<b>' + esc(parts[0] || 'Ort') + '</b><small>' + esc(parts.slice(1, 4).join(', ')) + '</small>';
            b.onclick = function () {
              list.classList.remove('on');
              q.blur();
              show(Number(p.lat), Number(p.lon), p.display_name, p.boundingbox);
            };
            list.appendChild(b);
          });
          list.classList.add('on');
        })
        .catch(function () {
          list.innerHTML = '<div class="row"><b>Suche nicht erreichbar</b></div>';
          list.classList.add('on');
        });
    }

    map.on('click', function (e) {
      list.classList.remove('on');
      fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=de&zoom=18&lat=' + e.latlng.lat + '&lon=' + e.latlng.lng)
        .then(function (r) { return r.json(); })
        .then(function (p) {
          show(e.latlng.lat, e.latlng.lng, p.display_name || (e.latlng.lat.toFixed(5) + ', ' + e.latlng.lng.toFixed(5)));
        })
        .catch(function () {
          show(e.latlng.lat, e.latlng.lng, e.latlng.lat.toFixed(5) + ', ' + e.latlng.lng.toFixed(5));
        });
    });

    document.getElementById('close').onclick = function () {
      document.getElementById('sheet').classList.remove('on');
      document.getElementById('fabs').classList.remove('up');
      if (mark) { map.removeLayer(mark); mark = null; }
      clearRoute();
    };

    function locate(cb) {
      map.once('locationfound', function (e) {
        me = e.latlng;
        if (meMark) map.removeLayer(meMark);
        meMark = L.circleMarker(me, { radius: 8, color: '#fff', weight: 3, fillColor: '#1a73e8', fillOpacity: 1 }).addTo(map);
        if (cb) cb();
      });
      map.once('locationerror', function () {
        document.getElementById('eta').classList.add('on');
        document.getElementById('et').textContent = '';
        document.getElementById('ed').textContent = 'Standort nicht verfügbar. Erlaube den Browser-Zugriff.';
      });
      map.locate({ enableHighAccuracy: true });
    }

    document.getElementById('loc').onclick = function () {
      locate(function () { map.setView(me, 15); });
    };

    var EP = {
      car: 'https://router.project-osrm.org/route/v1/driving/',
      bike: 'https://routing.openstreetmap.de/routed-bike/route/v1/driving/',
      foot: 'https://routing.openstreetmap.de/routed-foot/route/v1/driving/'
    };

    function renderTransitChoice(id, index) {
      if (id !== routeRequestId) return;
      var itinerary = transitJourneys[index];
      if (!itinerary) return;
      if (route) { map.removeLayer(route); route = null; }

      var layerGroup = L.layerGroup();
      var legHtml = [];

      (itinerary.legs || []).forEach(function (leg) {
        var isTransit = !['WALK', 'BIKE', 'CAR'].includes(leg.mode);
        var label = isTransit ? (leg.displayName || leg.routeShortName || leg.mode) : 'Zu Fuß';
        var from = leg.from && leg.from.name ? leg.from.name : 'Start';
        var to = leg.to && leg.to.name ? leg.to.name : 'Ziel';
        legHtml.push('<div><b>' + esc(label) + '</b>: ' + esc(from) + ' → ' + esc(to) + ' · ' + formatDuration(leg.duration || 0) + '</div>');

        var poly = leg.legGeometry && leg.legGeometry.points;
        if (poly) {
          try {
            var coords = decodePolyline(poly, leg.legGeometry.precision || 6);
            if (coords.length > 1) {
              var color = '#1a73e8';
              if (leg.routeColor && /^[0-9a-fA-F]{6}$/.test(String(leg.routeColor).replace('#',''))) color = '#' + String(leg.routeColor).replace('#','');
              layerGroup.addLayer(L.polyline(coords, { color: isTransit ? color : '#1a73e8', weight: isTransit ? 6 : 4, opacity: 0.9, dashArray: isTransit ? null : '6 6' }));
            }
          } catch (e) {
            console.warn('Polyline parse failed', e);
          }
        }
      });

      if (layerGroup.getLayers().length) {
        layerGroup.addTo(map);
        route = layerGroup;
        map.fitBounds(route.getBounds(), { paddingTopLeft: [30, 90], paddingBottomRight: [30, 260] });
      }

      document.getElementById('legs').innerHTML = legHtml.join('');
      document.getElementById('et').textContent = formatDuration(itinerary.duration || 0);
      document.getElementById('ed').textContent = (itinerary.transfers || 0) + ' Umstiege · ' + new Date(itinerary.startTime).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + '–' + new Date(itinerary.endTime).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });

      document.querySelectorAll('.choice').forEach(function (btn, i) {
        btn.setAttribute('aria-pressed', i === index ? 'true' : 'false');
      });
    }

    function renderTransitChoices(id) {
      var box = document.getElementById('choices');
      box.innerHTML = '';
      transitJourneys.forEach(function (it, i) {
        var b = document.createElement('button');
        b.className = 'choice';
        b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
        var dep = new Date(it.startTime).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        var arr = new Date(it.endTime).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        var live = (it.legs || []).some(function (leg) { return leg.realTime; });
        b.innerHTML = '<b>' + esc(dep) + ' → ' + esc(arr) + '</b><small>' + formatDuration(it.duration || 0) + ' · ' + (it.transfers || 0) + ' Umstiege' + (live ? ' · Echtzeit' : '') + '</small>';
        b.onclick = function () { renderTransitChoice(id, i); };
        box.appendChild(b);
      });

      if (nextTransitCursor) {
        var more = document.createElement('button');
        more.className = 'choice';
        more.innerHTML = '<b>Weitere</b><small>mehr Verbindungen</small>';
        more.onclick = function () {
          loadMoreTransit(id);
        };
        box.appendChild(more);
      }
    }

    function loadMoreTransit(id) {
      if (!nextTransitCursor) return;
      var params = new URLSearchParams({
        fromPlace: me.lat + ',' + me.lng,
        toPlace: target[0] + ',' + target[1],
        time: new Date().toISOString(),
        language: 'de',
        detailedLegs: 'true',
        detailedTransfers: 'true',
        numItineraries: '5',
        timetableView: 'true',
        searchWindow: '3600',
        realtimeMode: 'REALTIME',
        transitModes: 'TRANSIT',
        pageCursor: nextTransitCursor
      });

      fetch('https://api.transitous.org/api/v6/plan?' + params.toString(), { headers: { Accept: 'application/json' } })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (d) {
          if (id !== routeRequestId) return;
          var newItins = d && d.itineraries ? d.itineraries : [];
          transitJourneys = transitJourneys.concat(newItins);
          nextTransitCursor = d && d.nextPageCursor ? d.nextPageCursor : '';
          renderTransitChoices(id);
          if (transitJourneys.length) renderTransitChoice(id, 0);
        })
        .catch(function (err) {
          console.error(err);
        });
    }

    function calcTransit(id) {
      if (!me || !target) return;
      var params = new URLSearchParams({
        fromPlace: me.lat + ',' + me.lng,
        toPlace: target[0] + ',' + target[1],
        time: new Date().toISOString(),
        language: 'de',
        detailedLegs: 'true',
        detailedTransfers: 'true',
        numItineraries: '5',
        timetableView: 'true',
        searchWindow: '3600',
        realtimeMode: 'REALTIME',
        transitModes: 'TRANSIT'
      });

      fetch('https://api.transitous.org/api/v6/plan?' + params.toString(), { headers: { Accept: 'application/json' } })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (d) {
          if (id !== routeRequestId) return;
          transitJourneys = d && d.itineraries ? d.itineraries : [];
          nextTransitCursor = d && d.nextPageCursor ? d.nextPageCursor : '';
          if (!transitJourneys.length) {
            document.getElementById('et').textContent = '';
            document.getElementById('ed').textContent = 'Keine ÖPNV-Verbindung gefunden.';
            document.getElementById('choices').innerHTML = '';
            return;
          }
          renderTransitChoices(id);
          renderTransitChoice(id, 0);
        })
        .catch(function (err) {
          if (id !== routeRequestId) return;
          document.getElementById('et').textContent = '';
          document.getElementById('ed').textContent = 'ÖPNV-Verbindungen konnten nicht geladen werden.';
          console.error('Transit routing error:', err);
        });
    }

    function calcRoute() {
      if (!me || !target) return;
      var id = ++routeRequestId;
      clearRoute();
      document.getElementById('eta').classList.add('on');
      document.getElementById('et').textContent = 'Route wird gesucht …';
      document.getElementById('ed').textContent = '';

      if (mode === 'opnv') {
        calcTransit(id);
        return;
      }

      fetch(EP[mode] + me.lng + ',' + me.lat + ';' + target[1] + ',' + target[0] + '?overview=full&geometries=geojson')
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (d) {
          if (id !== routeRequestId) return;
          if (!d.routes || !d.routes.length) {
            document.getElementById('et').textContent = '';
            document.getElementById('ed').textContent = 'Keine Route gefunden.';
            return;
          }
          var routeData = d.routes[0];
          route = L.geoJSON(routeData.geometry, { style: { color: '#1a73e8', weight: 6, opacity: 0.9 } }).addTo(map);
          map.fitBounds(route.getBounds(), { paddingTopLeft: [30, 90], paddingBottomRight: [30, 220] });
          document.getElementById('et').textContent = formatDuration(routeData.duration || 0);
          document.getElementById('ed').textContent = (routeData.distance >= 1000 ? (routeData.distance / 1000).toFixed(1).replace('.', ',') + ' km' : Math.round(routeData.distance) + ' m');
        })
        .catch(function (err) {
          if (id !== routeRequestId) return;
          document.getElementById('et').textContent = '';
          document.getElementById('ed').textContent = 'Routenserver nicht erreichbar.';
          console.error('Routing error:', err);
        });
    }

    document.getElementById('go').onclick = function () {
      document.getElementById('eta').classList.add('on');
      document.getElementById('et').textContent = 'Standort wird ermittelt …';
      document.getElementById('ed').textContent = '';
      if (me) calcRoute(); else locate(calcRoute);
    };

    document.querySelectorAll('[data-m]').forEach(function (btn) {
      btn.onclick = function () {
        mode = btn.dataset.m;
        document.querySelectorAll('[data-m]').forEach(function (b) {
          b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
        });
        document.getElementById('et').textContent = '';
        document.getElementById('ed').textContent = 'Verkehrsmittel gewählt. Bitte „Route starten“ drücken.';
      };
    });
  </script>
</body>
</html>
