<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NX-Karten</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: rgba(255,255,255,0.96);
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #1a73e8;
      --line: #e5e7eb;
      --shadow: 0 10px 30px rgba(0,0,0,.18);
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    #map {
      position: absolute;
      inset: 0;
    }
    .topbar {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 90px;
      z-index: 1200;
    }
    .search-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--panel);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 10px 14px 10px 16px;
      backdrop-filter: blur(5px);
    }
    .search-wrap input {
      width: 100%;
      border: 0;
      outline: none;
      background: transparent;
      font-size: 1rem;
      color: var(--text);
    }
    .brand {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1200;
      background: var(--panel);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 10px 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--accent);
    }
    .results {
      display: none;
      margin-top: 10px;
      background: var(--panel);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      max-height: 42vh;
      overflow-y: auto;
    }
    .results.show { display: block; }
    .result-item {
      width: 100%;
      border: 0;
      background: transparent;
      padding: 12px 14px;
      text-align: left;
      color: var(--text);
      cursor: pointer;
      border-bottom: 1px solid var(--line);
      font-size: 0.95rem;
    }
    .result-item:last-child { border-bottom: 0; }
    .result-item:hover { background: #f3f4f6; }
    .result-item small {
      display: block;
      color: var(--muted);
      margin-top: 4px;
    }
    .panel {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: min(520px, calc(100vw - 24px));
      z-index: 1100;
      background: var(--panel);
      border-radius: 22px 22px 18px 18px;
      box-shadow: var(--shadow);
      padding: 18px 18px 14px;
      display: none;
    }
    .panel.open { display: block; }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .panel h2 {
      margin: 0;
      font-size: 1.2rem;
    }
    .close-btn {
      border: 0;
      background: transparent;
      font-size: 1.8rem;
      line-height: 1;
      cursor: pointer;
      color: var(--muted);
    }
    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      margin: 10px 0 14px;
    }
    .tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 600;
      border-bottom: 2px solid transparent;
    }
    .tab.active {
      color: var(--accent);
      border-color: var(--accent);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .field {
      display: block;
      margin-bottom: 12px;
    }
    .field label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .field input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      font-size: 1rem;
    }
    .mode-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 12px;
    }
    .mode-btn {
      border: 1px solid var(--line);
      background: white;
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      color: var(--text);
      font-weight: 600;
    }
    .mode-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .btn {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn.primary {
      background: var(--accent);
      color: white;
    }
    .btn.secondary {
      background: #eef3ff;
      color: var(--accent);
    }
    .meta {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 8px;
    }
    .route-output {
      display: none;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .route-output.show { display: block; }
    .route-output strong {
      display: block;
      font-size: 1.2rem;
    }
    .route-output small {
      color: var(--muted);
      display: block;
      margin-top: 4px;
    }
    .transport-options {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }
    .transport-option {
      min-width: 150px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #f8fafc;
      cursor: pointer;
      text-align: left;
    }
    .transport-option.active {
      border-color: var(--accent);
      background: #edf4ff;
    }
    .transport-option strong {
      display: block;
      font-size: 0.95rem;
    }
    .transport-option small {
      display: block;
      color: var(--muted);
      margin-top: 2px;
    }
    .floating-btns {
      position: fixed;
      right: 16px;
      bottom: 18px;
      z-index: 1200;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .floater {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.96);
      box-shadow: var(--shadow);
      font-size: 1.1rem;
      cursor: pointer;
    }
    @media (max-width: 600px) {
      .topbar { right: 72px; }
      .brand { right: 12px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="topbar">
    <div class="search-wrap">
      <span aria-label="Suche">🔍</span>
      <input id="searchInput" type="search" placeholder="Ort oder Adresse suchen" />
    </div>
    <div id="results" class="results"></div>
  </div>

  <div class="brand">NX</div>

  <div class="floating-btns">
    <button class="floater" id="toggleMap" title="Kartenmodus wechseln">🛰️</button>
    <button class="floater" id="locateMe" title="Zum eigenen Standort">◎</button>
  </div>

  <div id="infoPanel" class="panel">
    <div class="panel-header">
      <h2 id="placeName">Ort</h2>
      <button class="close-btn" id="closePanel" aria-label="Schließen">×</button>
    </div>
    <div id="placeAddress" class="meta">Adresse</div>

    <div class="tabs">
      <button class="tab active" data-tab="routeTab">Route</button>
      <button class="tab" data-tab="infoTab">Info</button>
    </div>

    <div id="routeTab" class="tab-content active">
      <div class="field">
        <label>Start</label>
        <input id="startInput" type="text" placeholder="Meine Position oder Adresse" />
      </div>

      <div class="field">
        <label>Ziel</label>
        <input id="goalInput" type="text" placeholder="Zieladresse" />
      </div>

      <div class="mode-row">
        <button class="mode-btn active" data-mode="car">Auto</button>
        <button class="mode-btn" data-mode="bike">Fahrrad</button>
        <button class="mode-btn" data-mode="foot">Zu Fuß</button>
        <button class="mode-btn" data-mode="opnv">ÖPNV</button>
      </div>

      <div class="actions">
        <button id="routeBtn" class="btn primary">Route starten</button>
        <button id="stopRouteBtn" class="btn secondary" style="display:none;">Navigation beenden</button>
      </div>

      <div id="routeOutput" class="route-output">
        <strong id="routeDuration">--</strong>
        <small id="routeDistance">--</small>
      </div>

      <div id="transportOptions" class="transport-options"></div>
    </div>

    <div id="infoTab" class="tab-content">
      <div id="infoText" class="meta">
        Weitere Informationen zu dieser Position.
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script>
    const map = L.map("map", { zoomControl: true }).setView([51.1657, 10.4515], 6);

    const osm = L.tileLayer("https://tile.openstreetmap.de/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap-Mitwirkende"
    }).addTo(map);

    const satellite = L.layerGroup([
      L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
        maxZoom: 19,
        attribution: "Tiles © Esri"
      }),
      L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places_Reference/MapServer/tile/{z}/{y}/{x}", {
        maxZoom: 19
      })
    ]);

    let useSatellite = false;
    document.getElementById("toggleMap").addEventListener("click", () => {
      useSatellite = !useSatellite;
      if (useSatellite) {
        map.removeLayer(osm);
        satellite.addTo(map);
      } else {
        map.removeLayer(satellite);
        osm.addTo(map);
      }
    });

    let selectedPlace = null;
    let selectedMarker = null;
    let currentMode = "car";
    let myLocation = null;
    let routeLayer = null;
    let watchId = null;
    let navigationActive = false;
    let transitResults = [];
    let selectedTransit = 0;

    const searchInput = document.getElementById("searchInput");
    const resultsBox = document.getElementById("results");
    const infoPanel = document.getElementById("infoPanel");
    const placeName = document.getElementById("placeName");
    const placeAddress = document.getElementById("placeAddress");
    const startInput = document.getElementById("startInput");
    const goalInput = document.getElementById("goalInput");
    const routeOutput = document.getElementById("routeOutput");
    const routeDuration = document.getElementById("routeDuration");
    const routeDistance = document.getElementById("routeDistance");
    const transportOptions = document.getElementById("transportOptions");

    function setPlace(lat, lng, displayName) {
      selectedPlace = { lat, lng };
      if (selectedMarker) map.removeLayer(selectedMarker);
      selectedMarker = L.marker([lat, lng]).addTo(map);
      map.setView([lat, lng], 15);

      placeName.textContent = displayName.split(",")[0] || "Ort";
      placeAddress.textContent = displayName || "Koordinaten";
      goalInput.value = displayName;
      infoPanel.classList.add("open");

      const infoText = document.getElementById("infoText");
      infoText.textContent = `Koordinaten: ${lat.toFixed(5)}, ${lng.toFixed(5)}\n\n${displayName}`;
    }

    function searchAddress(query) {
      if (!query || query.trim().length < 2) {
        resultsBox.innerHTML = "";
        resultsBox.classList.remove("show");
        return;
      }

      const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=de&q=" + encodeURIComponent(query);
      fetch(url)
        .then(r => r.json())
        .then(data => {
          resultsBox.innerHTML = "";
          if (!data.length) {
            resultsBox.innerHTML = '<button class="result-item">Keine Ergebnisse gefunden.</button>';
            resultsBox.classList.add("show");
            return;
          }

          data.forEach(item => {
            const btn = document.createElement("button");
            btn.className = "result-item";
            btn.innerHTML = `
              <strong>${item.display_name.split(",")[0]}</strong>
              <small>${item.display_name}</small>
            `;
            btn.addEventListener("click", () => {
              resultsBox.classList.remove("show");
              setPlace(Number(item.lat), Number(item.lon), item.display_name);
            });
            resultsBox.appendChild(btn);
          });
          resultsBox.classList.add("show");
        })
        .catch(() => {
          resultsBox.innerHTML = '<button class="result-item">Suche nicht verfügbar.</button>';
          resultsBox.classList.add("show");
        });
    }

    let searchTimer;
    searchInput.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => searchAddress(searchInput.value), 350);
    });

    document.getElementById("closePanel").addEventListener("click", () => {
      infoPanel.classList.remove("open");
      if (routeLayer) {
        map.removeLayer(routeLayer);
        routeLayer = null;
      }
    });

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tab));
        document.querySelectorAll(".tab-content").forEach(c => c.classList.toggle("active", c.id === tab.dataset.tab));
      });
    });

    document.querySelectorAll(".mode-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        currentMode = btn.dataset.mode;
        document.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b === btn));
      });
    });

    function geocodeAddress(text) {
      return fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=de&q=" + encodeURIComponent(text))
        .then(r => r.json())
        .then(data => {
          if (!data.length) throw new Error("Adresse nicht gefunden");
          return { lat: Number(data[0].lat), lng: Number(data[0].lon), displayName: data[0].display_name };
        });
    }

    function clearRoute() {
      if (routeLayer) {
        map.removeLayer(routeLayer);
        routeLayer = null;
      }
      routeOutput.classList.remove("show");
      transportOptions.innerHTML = "";
    }

    function decodePolyline(str) {
      let index = 0;
      const latlngs = [];
      let lat = 0;
      let lng = 0;
      while (index < str.length) {
        let b;
        let shift = 0;
        let result = 0;
        do {
          b = str.charCodeAt(index++) - 63;
          result |= (b & 0x1f) << shift;
          shift += 5;
        } while (b >= 0x20);
        lat += (result & 1) ? ~(result >> 1) : result >> 1;

        shift = 0;
        result = 0;
        do {
          b = str.charCodeAt(index++) - 63;
          result |= (b & 0x1f) << shift;
          shift += 5;
        } while (b >= 0x20);
        lng += (result & 1) ? ~(result >> 1) : result >> 1;

        latlngs.push([lat / 1e5, lng / 1e5]);
      }
      return latlngs;
    }

    function formatDuration(seconds) {
      const mins = Math.max(1, Math.round(seconds / 60));
      if (mins < 60) return `${mins} Min.`;
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return `${h} Std. ${m} Min.`;
    }

    function routeCarBikeFoot(start, end) {
      let base = "https://router.project-osrm.org/route/v1/driving/";
      if (currentMode === "bike") base = "https://router.project-osrm.org/route/v1/driving/";
      if (currentMode === "foot") base = "https://router.project-osrm.org/route/v1/foot/";
      if (currentMode === "car") base = "https://router.project-osrm.org/route/v1/driving/";
      const url = `${base}${start.lng},${start.lat};${end.lng},${end.lat}?overview=full&geometries=geojson`;

      fetch(url)
        .then(r => r.json())
        .then(data => {
          if (!data.routes || !data.routes.length) {
            routeDuration.textContent = "Keine Route verfügbar";
            routeDistance.textContent = "";
            routeOutput.classList.add("show");
            return;
          }

          const route = data.routes[0];
          const coords = route.geometry.coordinates.map(([lng, lat]) => [lat, lng]);
          if (routeLayer) map.removeLayer(routeLayer);
          routeLayer = L.polyline(coords, { color: "#1a73e8", weight: 6 }).addTo(map);
          map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });

          routeDuration.textContent = formatDuration(route.duration);
          routeDistance.textContent = `${(route.distance / 1000).toFixed(1).replace(".", ",")} km`;
          routeOutput.classList.add("show");
        })
        .catch(() => {
          routeDuration.textContent = "Route konnte nicht berechnet werden";
          routeDistance.textContent = "";
          routeOutput.classList.add("show");
        });
    }

    function renderTransitOptions(journeys) {
      transportOptions.innerHTML = "";
      if (!journeys || !journeys.length) {
        const div = document.createElement("div");
        div.className = "transport-option";
        div.innerHTML = "<strong>Keine Verbindungen</strong><small>Zu diesem Zeitpunkt keine ÖPNV-Angebote.</small>";
        transportOptions.appendChild(div);
        return;
      }

      journeys.forEach((journey, index) => {
        const btn = document.createElement("button");
        btn.className = "transport-option" + (index === selectedTransit ? " active" : "");
        btn.innerHTML = `
          <strong>${new Date(journey.startTime).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })} – ${new Date(journey.endTime).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })}</strong>
          <small>${formatDuration(journey.duration)} · ${journey.transfers || 0} Umstiege</small>
        `;
        btn.addEventListener("click", () => {
          selectedTransit = index;
          renderTransitOptions(journeys);
          drawTransitJourney(journey);
        });
        transportOptions.appendChild(btn);
      });
    }

    function drawTransitJourney(journey) {
      if (routeLayer) map.removeLayer(routeLayer);

      const legs = journey.legs || [];
      const coords = [];
      legs.forEach(leg => {
        if (leg.legGeometry && leg.legGeometry.points) {
          coords.push(...decodePolyline(leg.legGeometry.points));
        }
      });

      if (coords.length) {
        routeLayer = L.polyline(coords, { color: "#2d8cff", weight: 6 }).addTo(map);
        map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });
      }

      routeDuration.textContent = formatDuration(journey.duration);
      routeDistance.textContent = `${journey.transfers || 0} Umstiege · ${new Date(journey.startTime).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })}–${new Date(journey.endTime).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })}`;
      routeOutput.classList.add("show");
    }

    function fetchTransit(start, end) {
      const url = `https://api.transitous.org/api/v6/plan?fromPlace=${start.lat},${start.lng}&toPlace=${end.lat},${end.lng}&time=${encodeURIComponent(new Date().toISOString())}&language=de&numItineraries=5&detail=full`;
      fetch(url)
        .then(r => r.json())
        .then(data => {
          transitResults = data.itineraries || [];
          renderTransitOptions(transitResults);
          if (transitResults.length) {
            selectedTransit = 0;
            drawTransitJourney(transitResults[0]);
          } else {
            routeDuration.textContent = "Keine ÖPNV-Verbindung";
            routeDistance.textContent = "Für die gewählte Strecke nicht verfügbar";
            routeOutput.classList.add("show");
          }
        })
        .catch(() => {
          routeDuration.textContent = "ÖPNV-Suche fehlgeschlagen";
          routeDistance.textContent = "";
          routeOutput.classList.add("show");
        });
    }

    document.getElementById("routeBtn").addEventListener("click", async () => {
      clearRoute();

      const startValue = startInput.value.trim();
      const targetValue = goalInput.value.trim();

      if (!targetValue) {
        routeDuration.textContent = "Bitte ein Ziel eingeben";
        routeOutput.classList.add("show");
        return;
      }

      try {
        let startPoint;
        if (startValue && startValue.toLowerCase() !== "meine position") {
          startPoint = await geocodeAddress(startValue);
        } else if (myLocation) {
          startPoint = { lat: myLocation.lat, lng: myLocation.lng, displayName: "Mein Standort" };
        } else {
          startPoint = { lat: 51.1657, lng: 10.4515, displayName: "Deutschland" };
        }

        const endPoint = selectedPlace
          ? { lat: selectedPlace.lat, lng: selectedPlace.lng, displayName: goalInput.value }
          : await geocodeAddress(targetValue);

        if (currentMode === "opnv") {
          fetchTransit(startPoint, endPoint);
        } else {
          routeCarBikeFoot(startPoint, endPoint);
        }
      } catch (err) {
        routeDuration.textContent = "Route konnte nicht berechnet werden";
        routeDistance.textContent = err.message || "";
        routeOutput.classList.add("show");
      }
    });

    document.getElementById("locateMe").addEventListener("click", () => {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(pos => {
        myLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        map.setView([myLocation.lat, myLocation.lng], 14);
        startInput.value = "Meine Position";
        const marker = L.circleMarker([myLocation.lat, myLocation.lng], {
          radius: 8,
          color: "#fff",
          weight: 2,
          fillColor: "#2d8cff",
          fillOpacity: 1
        }).addTo(map);
        setTimeout(() => map.removeLayer(marker), 3000);
      });
    });

    document.getElementById("stopRouteBtn").addEventListener("click", () => {
      clearRoute();
      document.getElementById("stopRouteBtn").style.display = "none";
      navigationActive = false;
    });

    document.getElementById("searchInput").addEventListener("keydown", event => {
      if (event.key === "Enter") {
        const first = resultsBox.querySelector(".result-item");
        if (first) first.click();
      }
    });

    map.on("click", e => {
      const lat = e.latlng.lat;
      const lng = e.latlng.lng;
      fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=de&lat=${lat}&lon=${lng}`)
        .then(r => r.json())
        .then(data => {
          setPlace(lat, lng, data.display_name || `${lat.toFixed(5)}, ${lng.toFixed(5)}`);
        })
        .catch(() => setPlace(lat, lng, `${lat.toFixed(5)}, ${lng.toFixed(5)}`));
    });

    setPlace(51.1657, 10.4515, "Deutschland");
    startInput.value = "Meine Position";
    goalInput.value = "München";
    infoPanel.classList.add("open");
  </script>
</body>
</html>
