<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NX-Karten</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--ui:#fff;--ui2:#f1f3f4;--tx:#202124;--tx2:#5f6368;--ac:#1a73e8;--sh:0 2px 10px rgba(0,0,0,.28);--line:#e4e6e8}
@media(prefers-color-scheme:dark){:root{--ui:#2a2b2e;--ui2:#3a3c40;--tx:#e8eaed;--tx2:#a0a4aa;--ac:#8ab4f8;--sh:0 2px 10px rgba(0,0,0,.6);--line:#494b50}}
*{box-sizing:border-box}html,body{height:100%;margin:0;color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}#map{position:fixed;inset:0}.top{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);max-width:440px;z-index:1000}.bar{display:flex;align-items:center;background:var(--ui);border-radius:26px;box-shadow:var(--sh);padding:0 14px;height:48px;gap:10px}.bar input{flex:1;border:0;background:none;font:inherit;color:var(--tx);outline:none;min-width:0}.list{margin-top:6px;background:var(--ui);border-radius:16px;box-shadow:var(--sh);max-height:50vh;overflow:auto;display:none}.list.on{display:block}.row{display:block;padding:10px 14px;cursor:pointer;border:0;background:none;width:100%;text-align:left;font:inherit;color:var(--tx)}.row:hover,.row:focus-visible{background:var(--ui2);outline:none}.row small{display:block;color:var(--tx2)}.fabs{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:10px;z-index:1000;transition:bottom .2s}.fabs.up{bottom:calc(env(safe-area-inset-bottom,0px) + 330px)}.fab{width:44px;height:44px;border-radius:50%;border:0;background:var(--ui);box-shadow:var(--sh);color:var(--tx);font-size:20px;cursor:pointer}.fab:focus-visible,.btn:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1001;background:var(--ui);border-radius:22px 22px 0 0;box-shadow:0 -2px 14px rgba(0,0,0,.3);padding:16px 18px calc(env(safe-area-inset-bottom,0px) + 18px);max-width:560px;margin:0 auto;transform:translateY(110%);transition:transform .25s}.sheet.on{transform:none}.sheet h2{margin:0;font-size:19px;padding-right:28px}.sheet p{margin:2px 0 12px;color:var(--tx2)}.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.btn{border:1px solid var(--line);background:var(--ui2);color:var(--tx);border-radius:20px;padding:9px 14px;font:inherit;cursor:pointer}.btn.primary{background:var(--ac);border-color:var(--ac);color:#fff}.btn[aria-pressed=true]{background:var(--ac);color:#fff}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:8px 0 12px}.tab{border:0;background:transparent;color:var(--tx2);font:inherit;padding:9px 12px;cursor:pointer;border-bottom:2px solid transparent}.tab.active{color:var(--ac);border-color:var(--ac);font-weight:600}.panel{display:none}.panel.active{display:block}.field{display:block;margin:10px 0}.field span{display:block;font-size:13px;color:var(--tx2);margin-bottom:4px}.field input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--ui);color:var(--tx);font:inherit}.radio{display:flex;gap:8px;align-items:center;margin:8px 0}.eta{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.eta.on{display:block}.eta b{font-size:21px}.x{position:absolute;right:12px;top:10px;border:0;background:none;color:var(--tx2);font-size:24px;cursor:pointer}.legs{max-height:18vh;overflow:auto;margin-top:8px;color:var(--tx2);font-size:13px}.choices{display:flex;gap:7px;overflow-x:auto;margin-top:8px}.choice{white-space:nowrap;border:1px solid var(--line);border-radius:13px;background:var(--ui2);color:var(--tx);padding:8px 10px;text-align:left;cursor:pointer;min-width:130px}.choice[aria-pressed=true]{border-color:var(--ac)}.choice small{display:block;color:var(--tx2)}.status{font-size:12px;color:var(--tx2);margin-top:5px}.reviews-link{display:block;color:var(--ac);margin-top:8px;word-break:break-word}
</style>
</head>
<body>
<div id="map"></div>
<div class="top"><div class="bar"><span aria-hidden="true">Suchen</span><input id="q" type="search" placeholder="Ort oder Adresse suchen" autocomplete="off" aria-label="Suche"></div><div class="list" id="list"></div></div>
<div class="fabs" id="fabs"><button class="fab" id="sat" title="Satellit ein/aus" aria-label="Satellit ein oder aus">🛰</button><button class="fab" id="loc" title="Mein Standort" aria-label="Mein Standort">◎</button></div>
<div class="sheet" id="sheet" role="dialog" aria-live="polite"><button class="x" id="close" aria-label="Schließen">×</button><h2 id="sn"></h2><p id="sd"></p>
<div class="tabs" role="tablist"><button class="tab active" data-tab="routePanel" role="tab">Route</button><button class="tab" data-tab="reviewsPanel" role="tab">Bewertungen</button><button class="tab" data-tab="infoPanel" role="tab">Info</button></div>
<div class="panel active" id="routePanel" role="tabpanel">
<label class="radio"><input type="radio" name="originChoice" value="device" checked> Mein Gerätestandort</label>
<label class="radio"><input type="radio" name="originChoice" value="address"> Startadresse eingeben</label>
<label class="field" id="originField" hidden><span>Startadresse</span><input id="routeFrom" type="text" placeholder="Straße, Ort" autocomplete="street-address"></label>
<label class="field"><span>Zieladresse</span><input id="routeTo" type="text" placeholder="Ziel eingeben" autocomplete="street-address"></label>
<div class="acts" aria-label="Verkehrsmittel auswählen"><button class="btn" data-m="car" aria-pressed="true">Auto</button><button class="btn" data-m="bike" aria-pressed="false">Rad</button><button class="btn" data-m="foot" aria-pressed="false">Zu Fuß</button><button class="btn" data-m="opnv" aria-pressed="false">ÖPNV</button></div>
<div class="acts"><button class="btn primary" id="go">Route starten</button><button class="btn" id="stop" hidden>Navigation beenden</button></div>
</div>
<div class="panel" id="reviewsPanel" role="tabpanel"><p>Bewertungen und weitere Ortsdetails können über einen externen Anbieter angesehen werden.</p><a class="btn" id="reviewsLink" target="_blank" rel="noopener noreferrer">Bewertungen und Fotos ansehen ↗</a></div>
<div class="panel" id="infoPanel" role="tabpanel"><p id="placeInfo"></p></div>
<div class="eta" id="eta"><b id="et"></b> <span id="ed" style="color:var(--tx2)"></span><div class="status" id="status"></div><div class="choices" id="choices"></div><div class="legs" id="legs"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
var map=L.map('map',{zoomControl:false}).setView([51.45,6.8],10);L.control.zoom({position:'bottomleft'}).addTo(map);
var osm=L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap-Mitwirkende'}).addTo(map);
var satGroup=L.layerGroup([L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Bilder © Esri'}),L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19})]);var sat=false;
function $(id){return document.getElementById(id)}
$('sat').onclick=function(){sat=!sat;if(sat){map.removeLayer(osm);satGroup.addTo(map)}else{map.removeLayer(satGroup);osm.addTo(map)}};
var target=null,me=null,origin=null,mark=null,meMark=null,route=null,mode='car',requestId=0,watchId=null,navigating=false,lastRerouteAt=0,transitJourneys=[],nextCursor='',selectedTransit=0,transitParams=null,currentPlaceName='',currentPlaceAddress='';
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function formatDuration(sec){var m=Math.max(1,Math.round((Number(sec)||0)/60));return m<60?m+' Min.':Math.floor(m/60)+' Std. '+m%60+' Min.'}
function clearRoute(){if(route){map.removeLayer(route);route=null}$('legs').innerHTML='';$('choices').innerHTML=''}
function show(lat,lon,name,bb){target=[lat,lon];currentPlaceName=String(name).split(', ')[0]||'Ort';currentPlaceAddress=String(name);requestId++;clearRoute();$('eta').classList.remove('on');if(mark)map.removeLayer(mark);mark=L.marker(target).addTo(map);var p=String(name).split(', ');$('sn').textContent=p[0]||'Ort';$('sd').textContent=p.slice(1,5).join(', ');$('routeTo').value=currentPlaceAddress;$('reviewsLink').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(currentPlaceName+' '+currentPlaceAddress);$('placeInfo').textContent=currentPlaceAddress+' · Koordinaten: '+lat.toFixed(5)+', '+lon.toFixed(5);$('sheet').classList.add('on');$('fabs').classList.add('up');if(bb)map.fitBounds([[+bb[0],+bb[2]],[+bb[1],+bb[3]]],{maxZoom:17,paddingBottomRight:[0,330]});else map.setView(target,16)}
var q=$('q'),list=$('list'),searchTimer;
q.addEventListener('input',function(){clearTimeout(searchTimer);var t=q.value.trim();if(t.length<2){list.classList.remove('on');return}searchTimer=setTimeout(function(){fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=7&accept-language=de&q='+encodeURIComponent(t)).then(function(r){if(!r.ok)throw Error();return r.json()}).then(function(rows){list.innerHTML='';if(!rows.length)list.innerHTML='<div class="row">Keine Treffer.</div>';rows.forEach(function(p){var b=document.createElement('button');b.className='row';var parts=p.display_name.split(', ');b.innerHTML='<b>'+esc(parts[0])+'</b><small>'+esc(parts.slice(1,4).join(', '))+'</small>';b.onclick=function(){list.classList.remove('on');q.blur();show(+p.lat,+p.lon,p.display_name,p.boundingbox)};list.appendChild(b)});list.classList.add('on')}).catch(function(){list.innerHTML='<div class="row">Suche nicht erreichbar.</div>';list.classList.add('on')})},400)});
q.addEventListener('keydown',function(e){if(e.key==='Enter'){var b=list.querySelector('button');if(b)b.click()}});
function geocode(text){return fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=de&q='+encodeURIComponent(text)).then(function(r){if(!r.ok)throw Error('Geocoding fehlgeschlagen');return r.json()}).then(function(rows){if(!rows.length)throw Error('Adresse nicht gefunden: '+text);return{lat:Number(rows[0].lat),lng:Number(rows[0].lon),name:rows[0].display_name}})}
map.on('click',function(e){list.classList.remove('on');fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=de&zoom=18&lat='+e.latlng.lat+'&lon='+e.latlng.lng).then(function(r){return r.json()}).then(function(p){show(e.latlng.lat,e.latlng.lng,p.display_name||e.latlng.lat.toFixed(5)+', '+e.latlng.lng.toFixed(5))}).catch(function(){show(e.latlng.lat,e.latlng.lng,e.latlng.lat.toFixed(5)+', '+e.latlng.lng.toFixed(5))})});
document.querySelectorAll('[name="originChoice"]').forEach(function(r){r.onchange=function(){$('originField').hidden=r.value!=='address';if(r.value==='address')$('routeFrom').focus()}});
function locationUpdate(pos){var next=L.latLng(pos.coords.latitude,pos.coords.longitude),moved=me?map.distance(me,next):Infinity;me=next;if(meMark)meMark.setLatLng(me);else meMark=L.circleMarker(me,{radius:8,color:'#fff',weight:3,fillColor:'#1a73e8',fillOpacity:1}).addTo(map);$('status').textContent='GPS aktiv · Genauigkeit ca. '+Math.round(pos.coords.accuracy)+' m';if(navigating&&target&&mode!=='opnv'&&document.querySelector('[name="originChoice"]:checked').value==='device'&&moved>35&&Date.now()-lastRerouteAt>12000){lastRerouteAt=Date.now();origin={lat:me.lat,lng:me.lng};routeRoad(true)}if(navigating&&mode==='opnv'&&moved>150&&Date.now()-lastRerouteAt>60000){lastRerouteAt=Date.now();origin={lat:me.lat,lng:me.lng};searchTransit()}}
function locationError(e){$('status').textContent=e&&e.code===1?'Standortzugriff verweigert. Bitte im Browser erlauben.':'Standort gerade nicht verfügbar.';$('ed').textContent=$('status').textContent}
function locateOnce(cb){map.locate({enableHighAccuracy:true,timeout:15000});map.once('locationfound',function(e){locationUpdate({coords:{latitude:e.latlng.lat,longitude:e.latlng.lng,accuracy:e.accuracy||30}});if(cb)cb()});map.once('locationerror',locationError)}
$('loc').onclick=function(){locateOnce(function(){map.setView(me,16)})};
var endpoints={car:'https://router.project-osrm.org/route/v1/driving/',bike:'https://routing.openstreetmap.de/routed-bike/route/v1/driving/',foot:'https://routing.openstreetmap.de/routed-foot/route/v1/driving/'};
function decodePolyline(s,precision){var pts=[],i=0,lat=0,lng=0,f=Math.pow(10,precision||6);while(i<s.length){var b,shift=0,result=0;do{if(i>=s.length)return pts;b=s.charCodeAt(i++)-63;result|=(b&31)<<shift;shift+=5}while(b>=32);lat+=(result&1)?~(result>>1):(result>>1);shift=0;result=0;do{if(i>=s.length)return pts;b=s.charCodeAt(i++)-63;result|=(b&31)<<shift;shift+=5}while(b>=32);lng+=(result&1)?~(result>>1):(result>>1);pts.push([lat/f,lng/f])}return pts}
function routeRoad(isReroute){if(!origin||!target||mode==='opnv')return;var id=++requestId;if(!isReroute){$('et').textContent='Route wird berechnet …';$('ed').textContent=''}fetch(endpoints[mode]+origin.lng+','+origin.lat+';'+target[1]+','+target[0]+'?overview=full&geometries=geojson').then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(function(d){if(id!==requestId||!d.routes||!d.routes.length)return;var r=d.routes[0];if(route)map.removeLayer(route);route=L.geoJSON(r.geometry,{style:{color:'#1a73e8',weight:7,opacity:.9}}).addTo(map);$('et').textContent=formatDuration(r.duration);$('ed').textContent=r.distance>=1000?(r.distance/1000).toFixed(1).replace('.',',')+' km':Math.round(r.distance)+' m';$('status').textContent=navigating?'Navigation aktiv · Route wird aktualisiert':'Route berechnet';if(!navigating)map.fitBounds(route.getBounds(),{paddingTopLeft:[25,85],paddingBottomRight:[25,330]})}).catch(function(e){if(id!==requestId)return;$('ed').textContent='Route gerade nicht verfügbar. Verbindung prüfen.';console.error(e)})}
function renderTransit(index,id){if(id!==requestId)return;var it=transitJourneys[index];if(!it)return;selectedTransit=index;if(route){map.removeLayer(route);route=null}var group=L.layerGroup(),html=[];(it.legs||[]).forEach(function(leg){var transit=!['WALK','BIKE','CAR'].includes(leg.mode),label=transit?(leg.displayName||leg.routeShortName||leg.mode):'Zu Fuß';html.push('<div><b>'+esc(label)+'</b>: '+esc(leg.from&&leg.from.name||'Start')+' → '+esc(leg.to&&leg.to.name||'Ziel')+' · '+formatDuration(leg.duration)+(leg.realTime?' · Echtzeit':'')+(leg.cancelled?' · Ausfall':'')+'</div>');if(leg.legGeometry&&leg.legGeometry.points){var coords=decodePolyline(leg.legGeometry.points,leg.legGeometry.precision||6);if(coords.length>1){var c=String(leg.routeColor||'').replace('#','');if(!/^[a-f0-9]{6}$/i.test(c))c='#1a73e8';else c='#'+c;group.addLayer(L.polyline(coords,{color:transit?c:'#1a73e8',weight:transit?6:4,dashArray:transit?null:'6 6'}))}}});if(group.getLayers().length){group.addTo(map);route=group;if(!navigating)map.fitBounds(group.getBounds(),{paddingTopLeft:[25,85],paddingBottomRight:[25,330]})}$('legs').innerHTML=html.join('');$('et').textContent=formatDuration(it.duration);var live=(it.legs||[]).some(function(l){return l.realTime});$('ed').textContent=(it.transfers||0)+' Umstiege · '+new Date(it.startTime).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+'–'+new Date(it.endTime).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+(live?' · Echtzeitdaten verfügbar':'');document.querySelectorAll('.choice[data-index]').forEach(function(b){b.setAttribute('aria-pressed',Number(b.dataset.index)===index?'true':'false')});if(navigating)$('status').textContent='GPS aktiv · Echtzeitdaten abhängig vom Verkehrsverbund'}
function renderTransitChoices(id){var box=$('choices');box.innerHTML='';transitJourneys.forEach(function(it,i){var b=document.createElement('button');b.className='choice';b.dataset.index=i;b.setAttribute('aria-pressed',i===selectedTransit?'true':'false');var d=new Date(it.startTime).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),a=new Date(it.endTime).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});b.innerHTML='<b>'+esc(d)+' → '+esc(a)+'</b><small>'+formatDuration(it.duration)+' · '+(it.transfers||0)+' Umstiege'+((it.legs||[]).some(function(l){return l.realTime})?' · Live':'')+'</small>';b.onclick=function(){renderTransit(i,id)};box.appendChild(b)});if(nextCursor){var more=document.createElement('button');more.className='choice';more.innerHTML='<b>Weitere Verbindungen</b><small>Abfahrten laden</small>';more.onclick=loadMoreTransit;box.appendChild(more)}}
function transitQuery(cursor){var p=new URLSearchParams(transitParams);if(cursor)p.set('pageCursor',cursor);return p.toString()}
function searchTransit(){if(!origin||!target)return;var id=++requestId;transitJourneys=[];nextCursor='';selectedTransit=0;transitParams={fromPlace:origin.lat+','+origin.lng,toPlace:target[0]+','+target[1],time:new Date().toISOString(),language:'de',detailedLegs:'true',detailedTransfers:'true',numItineraries:'5',timetableView:'true',searchWindow:'3600',realtimeMode:'REALTIME',transitModes:'TRANSIT',joinInterlinedLegs:'false'};$('et').textContent='Verbindungen werden gesucht …';$('ed').textContent='';fetch('https://api.transitous.org/api/v6/plan?'+transitQuery(''),{headers:{Accept:'application/json'}}).then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(function(d){if(id!==requestId)return;transitJourneys=d.itineraries||[];nextCursor=d.nextPageCursor||'';if(!transitJourneys.length){$('et').textContent='';$('ed').textContent='Keine ÖPNV-Verbindung für diese Strecke oder Uhrzeit gefunden.';return}renderTransitChoices(id);renderTransit(0,id)}).catch(function(e){if(id!==requestId)return;$('et').textContent='';$('ed').textContent='ÖPNV-Verbindungen konnten nicht geladen werden. Internetverbindung prüfen.';console.error(e)})}
function loadMoreTransit(){if(!nextCursor)return;var id=requestId,cursor=nextCursor;nextCursor='';fetch('https://api.transitous.org/api/v6/plan?'+transitQuery(cursor),{headers:{Accept:'application/json'}}).then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(function(d){if(id!==requestId)return;transitJourneys=transitJourneys.concat(d.itineraries||[]);nextCursor=d.nextPageCursor||'';renderTransitChoices(id)}).catch(function(e){if(id===requestId){nextCursor=cursor;$('ed').textContent='Weitere Verbindungen konnten nicht geladen werden.';console.error(e)}})}
function beginRoute(){var destText=$('routeTo').value.trim();if(!destText){$('ed').textContent='Bitte ein Ziel eingeben.';return}$('eta').classList.add('on');$('et').textContent='Route wird vorbereitet …';$('ed').textContent='';var originChoice=document.querySelector('[name="originChoice"]:checked').value;var destinationPromise=(destText===currentPlaceAddress&&target)?Promise.resolve({lat:target[0],lng:target[1],name:currentPlaceAddress}):geocode(destText);var originPromise=originChoice==='device'?new Promise(function(resolve,reject){if(me){resolve({lat:me.lat,lng:me.lng});return}locateOnce(function(){if(me)resolve({lat:me.lat,lng:me.lng});else reject(Error('Standort nicht verfügbar'))})}):geocode($('routeFrom').value.trim());Promise.all([originPromise,destinationPromise]).then(function(points){origin=points[0];target=[points[1].lat,points[1].lng];$('routeTo').value=points[1].name||destText;if(mark)mark.setLatLng(target);else mark=L.marker(target).addTo(map);if(originChoice==='device'){startGpsTracking();if(mode==='opnv')searchTransit();else routeRoad(false)}else{stopGpsTracking();$('status').textContent='Startadresse: '+points[0].name;if(mode==='opnv')searchTransit();else routeRoad(false)}}).catch(function(e){$('et').textContent='';$('ed').textContent=e.message||'Start oder Ziel konnte nicht gefunden werden.'})}
function startGpsTracking(){if(!navigator.geolocation){$('ed').textContent='Dieser Browser unterstützt keine Standortbestimmung.';return}navigating=true;$('go').hidden=true;$('stop').hidden=false;if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(function(pos){var previous=me?L.latLng(me.lat,me.lng):null;locationUpdate(pos);if(previous&&target&&mode!=='opnv'&&map.distance(previous,me)>35&&Date.now()-lastRerouteAt>12000){lastRerouteAt=Date.now();origin={lat:me.lat,lng:me.lng};routeRoad(true)}},locationError,{enableHighAccuracy:true,maximumAge:2000,timeout:20000})}
function stopGpsTracking(){navigating=false;if(watchId!==null&&navigator.geolocation){navigator.geolocation.clearWatch(watchId);watchId=null}$('go').hidden=false;$('stop').hidden=true}
$('go').onclick=beginRoute;$('stop').onclick=function(){stopGpsTracking();$('status').textContent='Navigation beendet'};
document.querySelectorAll('[name="originChoice"]').forEach(function(r){r.onchange=function(){ $('originField').hidden=document.querySelector('[name="originChoice"]:checked').value!=='address'; if(!$('originField').hidden)$('routeFrom').focus()}});
document.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){mode=b.dataset.m;document.querySelectorAll('[data-m]').forEach(function(o){o.setAttribute('aria-pressed',o===b?'true':'false')});clearRoute();$('et').textContent='';$('ed').textContent='Verkehrsmittel gewählt. Route starten, um zu berechnen.'}});
document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',t===b)});document.querySelectorAll('.panel').forEach(function(p){p.classList.toggle('active',p.id===b.dataset.tab)})}});
$('close').onclick=function(){stopGpsTracking();$('sheet').classList.remove('on');$('fabs').classList.remove('up');if(mark){map.removeLayer(mark);mark=null}clearRoute()};
$('routeTo').value='';
</script>
</body>
</html>
