<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NX-Karten</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--ui:#fff;--ui2:#f1f3f4;--tx:#202124;--muted:#667085;--accent:#1a73e8;--line:#e4e7ec;--shadow:0 8px 26px #0002}*{box-sizing:border-box}html,body{height:100%;margin:0;color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}#map{position:fixed;inset:0}.top{position:fixed;z-index:1000;top:14px;left:14px;right:80px;max-width:460px}.search{height:48px;display:flex;align-items:center;gap:10px;padding:0 15px;border-radius:26px;background:var(--ui);box-shadow:var(--shadow)}.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--tx);font:inherit}.brand{position:fixed;z-index:1001;right:14px;top:14px;padding:10px 14px;border-radius:18px;background:var(--ui);box-shadow:var(--shadow);font-size:20px;font-weight:850;letter-spacing:.08em;color:var(--accent)}.results{display:none;margin-top:8px;max-height:42vh;overflow:auto;background:var(--ui);border-radius:16px;box-shadow:var(--shadow)}.results.open{display:block}.result{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--tx);padding:11px 14px;text-align:left;font:inherit;cursor:pointer}.result small{display:block;color:var(--muted);margin-top:3px}.floats{position:fixed;right:14px;bottom:18px;z-index:1000;display:grid;gap:9px}.float{width:44px;height:44px;border:0;border-radius:50%;background:var(--ui);box-shadow:var(--shadow);font-size:19px;cursor:pointer}.sheet{display:none;position:fixed;z-index:1100;left:50%;bottom:12px;transform:translateX(-50%);width:min(560px,calc(100vw - 20px));max-height:82vh;overflow:auto;padding:17px;background:var(--ui);border-radius:22px;box-shadow:var(--shadow)}.sheet.open{display:block}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.head h2{margin:0;font-size:20px}.sub{color:var(--muted);font-size:13px;margin:3px 0 12px}.close{position:relative;z-index:5;border:0;background:transparent;color:var(--muted);font-size:25px;line-height:1;cursor:pointer;padding:4px 8px;pointer-events:auto}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:7px 0 13px}.tab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:9px 12px;font:inherit;cursor:pointer}.tab.active{border-color:var(--accent);color:var(--accent);font-weight:700}.panel{display:none}.panel.active{display:block}.field{display:block;margin:10px 0}.field span{display:block;margin-bottom:4px;color:var(--muted);font-size:13px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--ui);color:var(--tx);font:inherit}.field textarea{min-height:75px;resize:vertical}.row{display:flex;align-items:center;gap:9px;margin:8px 0}.buttons{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.btn{border:1px solid var(--line);border-radius:999px;background:var(--ui2);color:var(--tx);padding:9px 13px;font:inherit;cursor:pointer}.btn.primary,.btn.selected{background:var(--accent);border-color:var(--accent);color:#fff}.status{color:var(--muted);font-size:13px;margin:8px 0}.output{display:none;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.output.open{display:block}.output strong{font-size:20px}.options{display:flex;gap:8px;overflow:auto;margin:8px 0}.option{min-width:145px;border:1px solid var(--line);border-radius:12px;background:var(--ui2);padding:9px;text-align:left;color:var(--tx);cursor:pointer}.option small{display:block;color:var(--muted)}.leg{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.review-summary{padding:10px;border-radius:12px;background:var(--ui2);margin-bottom:10px}.stars{color:#e99b00;letter-spacing:1px}.review{border-bottom:1px solid var(--line);padding:10px 0}.muted{color:var(--muted);font-size:12px}[hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{--ui:#292b2e;--ui2:#383a3e;--tx:#eceff1;--muted:#abb0b8;--line:#4a4d52;--accent:#8ab4f8;--shadow:0 8px 26px #0008}}
</style>
</head>
<body>
<div id="map"></div><div class="top"><div class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Ort oder Adresse suchen" aria-label="Ort oder Adresse suchen" autocomplete="off"></div><div class="results" id="results"></div></div><div class="brand" aria-label="NX-Karten">NX</div><div class="floats"><button class="float" id="sat" title="Satellitenkarte" aria-label="Satellitenkarte">🛰</button><button class="float" id="loc" title="Mein Standort" aria-label="Mein Standort">◎</button></div>
<section class="sheet" id="sheet" aria-live="polite"><div class="head"><h2 id="placeName">Ort</h2><button class="close" id="close" type="button" aria-label="Schließen">×</button></div><div class="sub" id="placeAddress"></div><div class="tabs" role="tablist"><button class="tab active" data-panel="routePanel" type="button">Route</button><button class="tab" data-panel="reviewsPanel" type="button">Rezensionen</button><button class="tab" data-panel="infoPanel" type="button">Info</button></div>
<div class="panel active" id="routePanel"><label class="row"><input type="radio" name="origin" value="device" checked> Mein Gerätestandort</label><label class="row"><input type="radio" name="origin" value="address"> Startadresse eingeben</label><label class="field" id="fromWrap" hidden><span>Startadresse</span><input id="from" placeholder="Straße, Ort" autocomplete="street-address"></label><label class="field"><span>Zieladresse</span><input id="to" placeholder="Adresse oder Ort" autocomplete="street-address"></label><div class="buttons"><button class="btn selected" data-mode="car" type="button">Auto</button><button class="btn" data-mode="bike" type="button">Rad</button><button class="btn" data-mode="foot" type="button">Zu Fuß</button><button class="btn" data-mode="transit" type="button">ÖPNV</button></div><button class="btn primary" id="start" type="button">Route starten</button><button class="btn" id="stop" type="button" hidden>Navigation beenden</button><div class="output" id="routeOutput"><strong id="duration"></strong> <span id="distance"></span><div class="status" id="navStatus"></div><div class="options" id="options"></div><div id="legs"></div></div></div>
<div class="panel" id="reviewsPanel"><div id="reviewSummary" class="review-summary"></div><div id="reviews"></div><h3>Rezension schreiben</h3><form id="reviewForm"><label class="field"><span>Name (optional)</span><input id="reviewer" maxlength="50" placeholder="Anonym"></label><label class="field"><span>Sterne</span><select id="rating"><option value="5">★★★★★ – Sehr gut</option><option value="4">★★★★☆ – Gut</option><option value="3">★★★☆☆ – In Ordnung</option><option value="2">★★☆☆☆ – Nicht gut</option><option value="1">★☆☆☆☆ – Schlecht</option></select></label><label class="field"><span>Deine Rezension</span><textarea id="reviewText" maxlength="1000" required placeholder="Deine Erfahrungen mit diesem Ort"></textarea></label><button class="btn primary" type="submit">Rezension speichern</button></form><p class="muted">Rezensionen werden nur lokal in diesem Browser gespeichert und sind nicht öffentlich sichtbar.</p></div><div class="panel" id="infoPanel"><p id="info"></p></div></section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const $=id=>document.getElementById(id);const map=L.map('map',{zoomControl:false}).setView([51.1657,10.4515],6);L.control.zoom({position:'bottomleft'}).addTo(map);const osm=L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap-Mitwirkende'}).addTo(map);const satellite=L.layerGroup([L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'}),L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19})]);let sat=false,place=null,placeMarker=null,myLocation=null,myMarker=null,routeLayer=null,mode='car',watchId=null,navActive=false,requestId=0,placeKey='';$('sat').onclick=()=>{sat=!sat;if(sat){map.removeLayer(osm);satellite.addTo(map)}else{map.removeLayer(satellite);osm.addTo(map)}};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showPlace(lat,lon,name,bounds){place={lat,lon,name};placeKey=lat.toFixed(4)+','+lon.toFixed(4);if(placeMarker)map.removeLayer(placeMarker);placeMarker=L.marker([lat,lon]).addTo(map);$('placeName').textContent=String(name).split(',')[0]||'Ort';$('placeAddress').textContent=name;$('to').value=name;$('info').textContent=name+' · '+lat.toFixed(5)+', '+lon.toFixed(5);renderReviews();$('sheet').classList.add('open');if(bounds)map.fitBounds([[+bounds[0],+bounds[2]],[+bounds[1],+bounds[3]]],{maxZoom:16,paddingBottomRight:[0,330]});else map.setView([lat,lon],15)}
const search=$('search'),results=$('results');let searchTimer;search.addEventListener('input',()=>{clearTimeout(searchTimer);let v=search.value.trim();if(v.length<2){results.classList.remove('open');return}searchTimer=setTimeout(()=>geocode(v,true),450)});search.addEventListener('keydown',e=>{if(e.key==='Enter'){const first=results.querySelector('button');if(first)first.click()}});
function geocode(text,showResults){return fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit='+(showResults?6:1)+'&accept-language=de&q='+encodeURIComponent(text)).then(r=>{if(!r.ok)throw Error('Adresssuche nicht erreichbar');return r.json()}).then(rows=>{if(showResults){results.innerHTML='';if(!rows.length)results.innerHTML='<div class="result">Keine Treffer.</div>';rows.forEach(p=>{const b=document.createElement('button');b.className='result';b.innerHTML='<b>'+esc(p.display_name.split(',')[0])+'</b><small>'+esc(p.display_name)+'</small>';b.onclick=()=>{results.classList.remove('open');search.blur();showPlace(+p.lat,+p.lon,p.display_name,p.boundingbox)};results.appendChild(b)});results.classList.add('open');return null}if(!rows.length)throw Error('Adresse nicht gefunden: '+text);return{lat:+rows[0].lat,lng:+rows[0].lon,name:rows[0].display_name}})}map.on('click',e=>{results.classList.remove('open');fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=de&lat='+e.latlng.lat+'&lon='+e.latlng.lng).then(r=>r.json()).then(p=>showPlace(e.latlng.lat,e.latlng.lng,p.display_name||'Kartenauswahl')).catch(()=>showPlace(e.latlng.lat,e.latlng.lng,'Kartenauswahl'))});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===b.dataset.panel))});document.querySelectorAll('[name="origin"]').forEach(r=>r.onchange=()=>{$('fromWrap').hidden=document.querySelector('[name="origin"]:checked').value!=='address'});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('selected',x===b))});
function locate(){return new Promise((resolve,reject)=>{if(!navigator.geolocation){reject(Error('Standort im Browser nicht verfügbar.'));return}navigator.geolocation.getCurrentPosition(p=>{myLocation={lat:p.coords.latitude,lng:p.coords.longitude};if(myMarker)myMarker.setLatLng([myLocation.lat,myLocation.lng]);else myMarker=L.circleMarker([myLocation.lat,myLocation.lng],{radius:8,color:'#fff',weight:3,fillColor:'#1a73e8',fillOpacity:1}).addTo(map);resolve(myLocation)},()=>reject(Error('Standortzugriff nicht möglich. Browser-Berechtigung prüfen.')),{enableHighAccuracy:true,timeout:15000,maximumAge:5000})})}$('loc').onclick=()=>locate().then(p=>map.setView([p.lat,p.lng],15)).catch(e=>alert(e.message));
function clearRoute(){if(routeLayer){map.removeLayer(routeLayer);routeLayer=null}$('options').innerHTML='';$('legs').innerHTML=''}const duration=s=>{let m=Math.max(1,Math.round((Number(s)||0)/60));return m<60?m+' Min.':Math.floor(m/60)+' Std. '+m%60+' Min.'};const endpoints={car:'https://router.project-osrm.org/route/v1/driving/',bike:'https://routing.openstreetmap.de/routed-bike/route/v1/driving/',foot:'https://routing.openstreetmap.de/routed-foot/route/v1/driving/'};
function routeRoad(a,b){const id=++requestId;return fetch(endpoints[mode]+a.lng+','+a.lat+';'+b.lng+','+b.lat+'?overview=full&geometries=geojson').then(r=>{if(!r.ok)throw Error('Routenserver HTTP '+r.status);return r.json()}).then(d=>{if(id!==requestId)return;if(!d.routes||!d.routes.length)throw Error('Keine Route gefunden.');const r=d.routes[0];clearRoute();routeLayer=L.geoJSON(r.geometry,{style:{color:'#1a73e8',weight:6}}).addTo(map);map.fitBounds(routeLayer.getBounds(),{padding:[50,280]});$('duration').textContent=duration(r.duration);$('distance').textContent=' · '+(r.distance/1000).toFixed(1).replace('.',',')+' km';$('routeOutput').classList.add('open')})}
function decodePolyline(s,p=6){let i=0,lat=0,lng=0,out=[],f=10**p;while(i<s.length){let b,sh=0,r=0;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);lat+=(r&1)?~(r>>1):(r>>1);sh=0;r=0;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);lng+=(r&1)?~(r>>1):(r>>1);out.push([lat/f,lng/f])}return out}
function showJourney(j,i){clearRoute();(j.legs||[]).forEach(l=>{const tr=!['WALK','BIKE','CAR'].includes(l.mode),d=document.createElement('div');d.className='leg';d.textContent=(tr?(l.displayName||l.routeShortName||l.mode):'Zu Fuß')+': '+(l.from?.name||'Start')+' → '+(l.to?.name||'Ziel')+' · '+duration(l.duration)+(l.realTime?' · Echtzeit':'');$('legs').appendChild(d);if(l.legGeometry?.points){const c=decodePolyline(l.legGeometry.points,l.legGeometry.precision||6);if(c.length>1){if(!routeLayer)routeLayer=L.layerGroup();routeLayer.addLayer(L.polyline(c,{color:'#2678e8',weight:tr?6:4,dashArray:tr?null:'6 6'}))}}});if(routeLayer){routeLayer.addTo(map);map.fitBounds(routeLayer.getBounds(),{padding:[50,280]})}$('duration').textContent=duration(j.duration);$('distance').textContent=' · '+(j.transfers||0)+' Umstiege';$('routeOutput').classList.add('open');document.querySelectorAll('.option').forEach((b,n)=>b.classList.toggle('selected',n===i))}
function routeTransit(a,b){const p=new URLSearchParams({fromPlace:a.lat+','+a.lng,toPlace:b.lat+','+b.lng,time:new Date().toISOString(),language:'de',detailedLegs:'true',detailedTransfers:'true',numItineraries:'5',timetableView:'true',searchWindow:'3600',realtimeMode:'REALTIME',transitModes:'TRANSIT'});return fetch('https://api.transitous.org/api/v6/plan?'+p).then(r=>{if(!r.ok)throw Error('ÖPNV-Server HTTP '+r.status);return r.json()}).then(d=>{const journeys=d.itineraries||[];if(!journeys.length)throw Error('Keine ÖPNV-Verbindung gefunden.');$('options').innerHTML='';journeys.forEach((j,i)=>{const b=document.createElement('button');b.className='option';b.innerHTML='<strong>'+new Date(j.startTime).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' → '+new Date(j.endTime).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+'</strong><small>'+duration(j.duration)+' · '+(j.transfers||0)+' Umstiege</small>';b.onclick=()=>showJourney(j,i);$('options').appendChild(b)});showJourney(journeys[0],0)})}
$('start').onclick=async()=>{clearRoute();$('routeOutput').classList.add('open');$('duration').textContent='Route wird gesucht …';$('distance').textContent='';try{const a=document.querySelector('[name="origin"]:checked').value==='device'?await locate():await geocode($('from').value.trim(),false);const b=await geocode($('to').value.trim(),false);if(mode==='transit')await routeTransit(a,b);else await routeRoad(a,b)}catch(e){$('duration').textContent=e.message||'Route konnte nicht berechnet werden'}};
// Bewertungen bleiben in NX-Karten; nur lokal auf diesem Gerät gespeichert.
const KEY='nx-karten-reviews-v1';function stored(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}}function renderReviews(){const entries=stored()[placeKey]||[],avg=entries.length?entries.reduce((s,r)=>s+ +r.rating,0)/entries.length:0;$('reviewSummary').innerHTML=entries.length?'<b class="stars">'+('★'.repeat(Math.round(avg)))+('☆'.repeat(5-Math.round(avg)))+'</b> '+avg.toFixed(1).replace('.',',')+'/5 · '+entries.length+' Rezensionen':'<b>Noch keine Rezensionen</b><div class="muted">Schreibe die erste Bewertung auf diesem Gerät.</div>';$('reviews').innerHTML='';entries.slice().reverse().forEach(r=>{const a=document.createElement('article');a.className='review';const n=document.createElement('b');n.textContent=r.name||'Anonym';const s=document.createElement('div');s.className='stars';s.textContent='★'.repeat(r.rating)+'☆'.repeat(5-r.rating);const t=document.createElement('p');t.textContent=r.text;const dt=document.createElement('small');dt.className='muted';dt.textContent=new Date(r.date).toLocaleDateString('de-DE');a.append(n,s,t,dt);$('reviews').appendChild(a)})}$('reviewForm').onsubmit=e=>{e.preventDefault();const all=stored();(all[placeKey]||(all[placeKey]=[])).push({name:$('reviewer').value.trim()||'Anonym',rating:+$('rating').value,text:$('reviewText').value.trim(),date:new Date().toISOString()});try{localStorage.setItem(KEY,JSON.stringify(all));$('reviewText').value='';renderReviews()}catch(_){alert('Speichern im Browser nicht möglich.')}};
// Schließen blendet ausschließlich das Ortsfenster aus; Startansicht bleibt eine leere Karte ohne vorausgewähltes Ziel.
$('close').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(watchId!==null&&navigator.geolocation)navigator.geolocation.clearWatch(watchId);watchId=null;navActive=false;$('stop').hidden=true;$('sheet').classList.remove('open');clearRoute();if(placeMarker){map.removeLayer(placeMarker);placeMarker=null}place=null});
</script>
</body>
</html>
