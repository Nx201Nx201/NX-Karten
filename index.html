<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NX-Karten</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"><style>
:root{--ui:#fff;--soft:#f1f3f4;--tx:#202124;--muted:#667085;--blue:#1a73e8;--line:#e4e7ec;--shadow:0 6px 22px #0002}*{box-sizing:border-box}html,body{height:100%;height:100dvh;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;margin:0;font:15px/1.4 system-ui,sans-serif;color:var(--tx)}#map{position:fixed;inset:0;background:#dfe8ee}#warn{position:fixed;z-index:3000;left:50%;top:76px;transform:translateX(-50%);max-width:90vw;padding:10px 14px;border-radius:12px;background:#b42318;color:#fff;font-size:14px;box-shadow:var(--shadow)}.top{position:fixed;z-index:1000;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;right:82px;max-width:460px}.search{height:48px;display:flex;align-items:center;gap:10px;padding:0 15px;border-radius:26px;background:var(--ui);box-shadow:var(--shadow)}.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--tx);font:inherit}.brand{position:fixed;z-index:1001;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);padding:10px 14px;border-radius:18px;background:var(--ui);box-shadow:var(--shadow);font-size:20px;font-weight:850;letter-spacing:.08em;color:var(--blue)}.results{display:none;margin-top:8px;max-height:42vh;max-height:42dvh;overflow:auto;background:var(--ui);border-radius:16px;box-shadow:var(--shadow)}.results.open{display:block}.result{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--tx);padding:11px 14px;text-align:left;font:inherit;cursor:pointer}.result small{display:block;color:var(--muted);margin-top:3px}.floats{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px + var(--sheetH,0px));z-index:1000;display:grid;gap:9px}.float{width:44px;height:44px;border:0;border-radius:50%;background:var(--ui);box-shadow:var(--shadow);font-size:19px;cursor:pointer}.sheet{display:none;position:fixed;z-index:1100;left:50%;bottom:12px;transform:translateX(-50%);width:min(560px,calc(100vw - 20px));max-height:82vh;overflow:auto;padding:17px;background:var(--ui);border-radius:22px;box-shadow:var(--shadow)}.sheet.open{display:block}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.head h2{margin:0;font-size:20px}.sub{color:var(--muted);font-size:13px;margin:3px 0 12px}.close{position:relative;z-index:5;border:0;background:transparent;color:var(--muted);font-size:25px;line-height:1;cursor:pointer;padding:4px 8px}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:7px 0 13px}.tab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:9px 12px;font:inherit;cursor:pointer}.tab.active{border-color:var(--blue);color:var(--blue);font-weight:700}.panel{display:none}.panel.active{display:block}.field{display:block;margin:10px 0}.field span{display:block;margin-bottom:4px;color:var(--muted);font-size:13px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--ui);color:var(--tx);font:inherit}.field textarea{min-height:75px;resize:vertical}.row{display:flex;align-items:center;gap:9px;margin:8px 0}.buttons{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.btn{border:1px solid var(--line);border-radius:999px;background:var(--soft);color:var(--tx);padding:9px 13px;font:inherit;cursor:pointer}.btn.primary,.btn.selected{background:var(--blue);border-color:var(--blue);color:#fff}.status{color:var(--muted);font-size:13px;margin:8px 0}.status.error{color:#b42318}.output{display:none;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.output.open{display:block}.output strong{font-size:20px}.options{display:flex;gap:8px;overflow:auto;margin:8px 0}.option{flex:none;min-width:145px;border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:9px;text-align:left;color:var(--tx);cursor:pointer;font:inherit}.option.active{border-color:var(--blue);outline:1px solid var(--blue)}.option small{display:block;color:var(--muted)}.leg{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.review-summary{padding:10px;border-radius:12px;background:var(--soft);margin-bottom:10px}.review{border-bottom:1px solid var(--line);padding:10px 0}.muted{color:var(--muted);font-size:12px}[hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{--ui:#292b2e;--soft:#383a3e;--tx:#eceff1;--muted:#abb0b8;--line:#4a4d52;--blue:#8ab4f8;--shadow:0 8px 26px #0008}}
#navTop{position:fixed;z-index:1200;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);max-width:560px;margin:0 auto;display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:18px;background:#0b57d0;color:#fff;box-shadow:var(--shadow)}#navIcon{font-size:42px;line-height:1;min-width:48px;text-align:center}#navDist{font-size:26px}#navText{font-size:16px}#navBot{position:fixed;z-index:1200;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:20px;background:var(--ui);box-shadow:var(--shadow)}#navBot>div{flex:1}#navEta{font-size:22px}.navigating .top,.navigating .brand{display:none}.navigating .floats{bottom:96px}
button.leg{display:block;width:100%;text-align:left;background:none;color:var(--tx);font:inherit;font-size:13px;border:0;border-bottom:1px solid var(--line);cursor:pointer}.leg small{display:block;color:var(--muted)}.leg.active{background:var(--soft)}.stops{margin:2px 0 8px 8px;padding:2px 0 2px 12px;border-left:3px solid var(--blue);font-size:13px;color:var(--muted);white-space:pre-wrap}
input,textarea,select{font-size:16px!important}.btn,.tab{min-height:40px}.grab{display:none}.sheet.min .tabs,.sheet.min .panel{display:none}
@media(max-width:600px){
.sheet{left:0;bottom:0;transform:none;width:100%;max-height:60vh;max-height:60dvh;border-radius:20px 20px 0 0;padding:6px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.grab{display:block;width:56px;height:19px;padding:7px 0;margin:0 auto 4px;border:0;background:var(--line);background-clip:content-box;cursor:pointer}
.leaflet-control-zoom{display:none}.leaflet-control-attribution{font-size:9px}
.top{right:76px}.brand{padding:8px 12px;font-size:18px}
.option{min-width:130px}.head h2{font-size:18px}
}
</style></head><body>
<div id="map"></div><div class="top"><div class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Ort oder Adresse suchen" aria-label="Ort oder Adresse suchen" autocomplete="off"></div><div class="results" id="results"></div></div><div class="brand">NX</div><div class="floats"><button class="float" id="sat" title="Satellitenkarte">🛰</button><button class="float" id="loc" title="Mein Standort">◎</button></div>
<section class="sheet" id="sheet" aria-live="polite"><button class="grab" id="grab" type="button" aria-label="Fenster ein- oder ausklappen"></button><div class="head"><h2 id="placeName">Ort</h2><button class="close" id="close" type="button" aria-label="Schließen">×</button></div><div id="placeAddress" class="sub"></div><div class="tabs"><button class="tab active" data-panel="routePanel">Route</button><button class="tab" data-panel="reviewsPanel">Rezensionen</button><button class="tab" data-panel="infoPanel">Info</button></div>
<div class="panel active" id="routePanel"><label class="row"><input type="radio" name="origin" value="device" checked> Mein Gerätestandort</label><label class="row"><input type="radio" name="origin" value="address"> Startadresse eingeben</label><label class="field" id="fromWrap" hidden><span>Startadresse</span><input id="from" placeholder="Straße, Ort"></label><label class="field"><span>Zieladresse</span><input id="to" placeholder="Adresse oder Ort"></label><div class="buttons"><button class="btn selected" data-mode="car">Auto</button><button class="btn" data-mode="bike">Rad</button><button class="btn" data-mode="foot">Zu Fuß</button><button class="btn" data-mode="transit">ÖPNV</button></div><button class="btn primary" id="start">Route starten</button> <button class="btn" id="stop" hidden>Route beenden</button><div class="output" id="routeOutput"><strong id="duration"></strong> <span id="distance"></span><div class="status" id="status"></div><div class="options" id="options"></div><button class="btn primary" id="tgo" type="button" hidden style="margin:6px 0 8px">Navigation starten</button><div id="legs"></div></div></div>
<div class="panel" id="reviewsPanel"><div id="reviewSummary" class="review-summary"></div><div id="reviews"></div><h3>Rezension schreiben</h3><form id="reviewForm"><label class="field"><span>Name (optional)</span><input id="reviewer" maxlength="50" placeholder="Anonym"></label><label class="field"><span>Sterne</span><select id="rating"><option value="5">★★★★★ – Sehr gut</option><option value="4">★★★★☆ – Gut</option><option value="3">★★★☆☆ – In Ordnung</option><option value="2">★★☆☆☆ – Nicht gut</option><option value="1">★☆☆☆☆ – Schlecht</option></select></label><label class="field"><span>Deine Rezension</span><textarea id="reviewText" maxlength="1000" required></textarea></label><button class="btn primary">Speichern</button></form><p class="muted">Nur lokal in diesem Browser gespeichert.</p></div><div class="panel" id="infoPanel"><p id="info"></p></div></section>
<div id="navTop" hidden><div id="navIcon">↑</div><div><b id="navDist"></b><div id="navText"></div></div></div>
<div id="navBot" hidden><div><b id="navEta"></b><span id="navRest" class="muted"></span></div><button class="btn" id="navVoice" aria-label="Sprachansage">🔊</button><button class="btn primary" id="navEnd">Beenden</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script><script>
const $=id=>document.getElementById(id);
function warn(t){let w=document.getElementById('warn');if(!w){w=document.createElement('div');w.id='warn';document.body.appendChild(w)}w.textContent=t}
if(typeof L==='undefined'){warn('Leaflet konnte nicht geladen werden (cdnjs blockiert?). Adblocker oder Netzwerk prüfen.');throw Error('Leaflet fehlt')}
const STORE='nx-karten-reviews-v1';
const map=L.map('map',{zoomControl:false}).setView([20,0],2);
L.control.zoom({position:'bottomleft'}).addTo(map);
const osm=L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap-Mitwirkende'}).addTo(map);
let tileErr=0,fallback=false;
osm.on('tileerror',()=>{tileErr++;
 if(tileErr===4&&!fallback){fallback=true;osm.setUrl('https://tile.openstreetmap.org/{z}/{x}/{y}.png')}
 else if(tileErr===16)warn('Kartenkacheln werden nicht geladen. Adblocker, VPN oder Netzwerk prüfen (tile.openstreetmap.org).')});
osm.on('tileload',()=>{const w=document.getElementById('warn');if(w&&w.textContent.indexOf('Kachel')>=0)w.remove()});
window.addEventListener('load',()=>map.invalidateSize());
const satellite=L.layerGroup([L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'}),L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19})]);
let sat=false,place=null,placeKey='',marker=null,userLoc=null,userMarker=null,routeLayer=null,mode='car',watchId=null;
$('sat').onclick=()=>{sat=!sat;if(sat){map.removeLayer(osm);satellite.addTo(map)}else{map.removeLayer(satellite);osm.addTo(map)}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function setPlace(lat,lon,name,bounds){
 place={lat,lng:lon,name};placeKey=lat.toFixed(4)+','+lon.toFixed(4);
 if(marker)map.removeLayer(marker);marker=L.marker([lat,lon]).addTo(map);
 $('placeName').textContent=name.split(',')[0]||'Ort';$('placeAddress').textContent=name;$('to').value=name;
 $('info').textContent=name+' · '+lat.toFixed(5)+', '+lon.toFixed(5);
 clearRoute();stopTrack();$('routeOutput').classList.remove('open');renderReviews();$('sheet').classList.remove('min');$('sheet').classList.add('open');
 if(bounds)map.fitBounds([[+bounds[0],+bounds[2]],[+bounds[1],+bounds[3]]],{maxZoom:16,paddingBottomRight:[0,padB()]});else map.setView([lat,lon],15);
}
function geocode(text,multiple=false){
 return fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit='+(multiple?6:1)+'&accept-language=de&q='+encodeURIComponent(text))
 .then(r=>{if(!r.ok)throw Error('Adresssuche nicht erreichbar');return r.json()})
 .then(rows=>{
  if(multiple){$('results').innerHTML='';if(!rows.length)$('results').innerHTML='<div class="result">Keine Treffer.</div>';
   rows.forEach(p=>{const b=document.createElement('button');b.className='result';b.innerHTML='<b>'+esc(p.display_name.split(',')[0])+'</b><small>'+esc(p.display_name)+'</small>';
    b.onclick=()=>{$('results').classList.remove('open');$('search').blur();setPlace(+p.lat,+p.lon,p.display_name,p.boundingbox)};$('results').appendChild(b)});
   $('results').classList.add('open');return null}
  if(!rows.length)throw Error('Adresse nicht gefunden: '+text);
  return{lat:+rows[0].lat,lng:+rows[0].lon,name:rows[0].display_name}});
}
let timer;
$('search').addEventListener('input',()=>{clearTimeout(timer);const v=$('search').value.trim();if(v.length<2){$('results').classList.remove('open');return}
 timer=setTimeout(()=>geocode(v,true).catch(()=>{$('results').innerHTML='<div class="result">Suche nicht erreichbar</div>';$('results').classList.add('open')}),450)});
$('search').addEventListener('keydown',e=>{if(e.key==='Enter')$('results').querySelector('button')?.click()});
map.on('click',e=>{if(NAV||TN)return;fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=de&lat='+e.latlng.lat+'&lon='+e.latlng.lng).then(r=>r.json()).then(p=>setPlace(e.latlng.lat,e.latlng.lng,p.display_name||'Kartenauswahl')).catch(()=>setPlace(e.latlng.lat,e.latlng.lng,'Kartenauswahl'))});

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===b.dataset.panel))});
document.querySelectorAll('[name="origin"]').forEach(r=>r.onchange=()=>{$('fromWrap').hidden=document.querySelector('[name="origin"]:checked').value!=='address'});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('selected',x===b))});

function showUser(p){userLoc={lat:p.coords.latitude,lng:p.coords.longitude};
 if(userMarker)userMarker.setLatLng([userLoc.lat,userLoc.lng]);else userMarker=L.circleMarker([userLoc.lat,userLoc.lng],{radius:8,color:'#fff',weight:3,fillColor:'#1a73e8',fillOpacity:1}).addTo(map)}
function locate(){return new Promise((resolve,reject)=>{
 if(!window.isSecureContext){reject(Error('Standortzugriff braucht HTTPS.'));return}
 if(!navigator.geolocation){reject(Error('Dieser Browser unterstützt keine Standortbestimmung.'));return}
 navigator.geolocation.getCurrentPosition(p=>{showUser(p);resolve(userLoc)},e=>{
  const msg=e.code===1?'Standortberechtigung verweigert. Erlaube den Zugriff für diese Website in den Browser-Einstellungen.':e.code===2?'Gerätestandort nicht verfügbar. Aktiviere GPS/Standortdienste.':'Standortsuche abgelaufen. Bitte erneut versuchen.';
  reject(Error(msg))},{enableHighAccuracy:true,timeout:30000,maximumAge:15000})})}
$('loc').onclick=()=>(follow=true,locate()).then(l=>map.setView([l.lat,l.lng],15)).catch(e=>alert(e.message));

function clearRoute(){if(routeLayer){map.removeLayer(routeLayer);routeLayer=null}$('legs').innerHTML='';$('tgo').hidden=true}
const fmt=s=>{let m=Math.max(1,Math.round((+s||0)/60));return m<60?m+' Min.':Math.floor(m/60)+' Std. '+m%60+' Min.'};
const clock=t=>new Date(t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
const profiles={car:'https://router.project-osrm.org/route/v1/driving/',bike:'https://routing.openstreetmap.de/routed-bike/route/v1/driving/',foot:'https://routing.openstreetmap.de/routed-foot/route/v1/driving/'};
const MODES={WALK:'Zu Fuß',BIKE:'Rad',CAR:'Auto',BUS:'Bus',TRAM:'Straßenbahn',SUBWAY:'U-Bahn',RAIL:'Bahn',REGIONAL_RAIL:'Regionalbahn',REGIONAL_FAST_RAIL:'Regionalexpress',HIGHSPEED_RAIL:'ICE',LONG_DISTANCE:'Fernverkehr',NIGHT_RAIL:'Nachtzug',FERRY:'Fähre',SUBURBAN:'S-Bahn'};
function msg(t,err){$('status').textContent=t;$('status').classList.toggle('error',!!err)}

async function startRoute(){
 clearRoute();$('options').innerHTML='';$('routeOutput').classList.add('open');
 $('duration').textContent='Route wird gesucht …';$('distance').textContent='';msg('');
 try{
  const start=document.querySelector('[name="origin"]:checked').value==='device'?await locate():await geocode($('from').value.trim());
  const toText=$('to').value.trim();
  const end=(place&&toText===place.name)?place:await geocode(toText);
  if(mode==='transit'){
   const p=new URLSearchParams({fromPlace:start.lat+','+start.lng,toPlace:end.lat+','+end.lng,time:new Date().toISOString(),language:'de',numItineraries:'5'});
   const r=await fetch('https://api.transitous.org/api/v6/plan?'+p);
   if(!r.ok)throw Error('ÖPNV-Server antwortet mit Fehler '+r.status);
   const d=await r.json();
   if(!d.itineraries||!d.itineraries.length)throw Error('Keine ÖPNV-Verbindung gefunden');
   d.itineraries.forEach((j,i)=>{const b=document.createElement('button');b.className='option'+(i?'':' active');
    b.innerHTML='<b>'+clock(j.startTime)+' → '+clock(j.endTime)+'</b><small>'+fmt(j.duration)+' · '+(j.transfers||0)+' Umstiege</small>';
    b.onclick=()=>{document.querySelectorAll('.option').forEach(o=>o.classList.toggle('active',o===b));drawTransit(j)};$('options').appendChild(b)});
   drawTransit(d.itineraries[0]);return}
  const r=await fetch(profiles[mode]+start.lng+','+start.lat+';'+end.lng+','+end.lat+'?overview=full&geometries=geojson&steps=true');
  if(!r.ok)throw Error('Routenserver antwortet mit Fehler '+r.status);
  const d=await r.json();
  if(!d.routes||!d.routes.length)throw Error('Keine Route gefunden');
  const rt=d.routes[0];
  routeLayer=L.geoJSON(rt.geometry,{style:{color:'#1a73e8',weight:6}}).addTo(map);
  map.fitBounds(routeLayer.getBounds(),{padding:[50,50],paddingBottomRight:[50,padB()]});
  $('duration').textContent=fmt(rt.duration);$('distance').textContent=' · '+(rt.distance/1000).toFixed(1).replace('.',',')+' km';
  if(document.querySelector('[name="origin"]:checked').value==='device')beginNav(rt,end);else track();
 }catch(e){$('duration').textContent='';msg(e.message==='Failed to fetch'?'Server nicht erreichbar. Prüfe deine Internetverbindung.':e.message,true)}
}
function drawTransit(j){
 clearRoute();routeLayer=L.featureGroup().addTo(map);const items=[];
 const fit=l=>map.fitBounds(l.getBounds(),{padding:[50,50],paddingBottomRight:[50,padB()]});
 function sel(i){const on=items[i]&&!items[i].d.classList.contains('active')?i:-1;
  items.forEach((it,k)=>{const a=k===on;it.d.classList.toggle('active',a);it.det.hidden=!a;
   if(it.line)it.line.setStyle(a?{weight:11,opacity:1}:{weight:it.w,opacity:on<0?1:.3});if(a&&it.line)it.line.bringToFront()});
  if(on>=0){if(items[on].line)fit(items[on].line);items[on].d.scrollIntoView({block:'nearest'})}
  else if(routeLayer.getLayers().length)fit(routeLayer)}
 (j.legs||[]).forEach((l,i)=>{
  const walk=l.mode==='WALK',w=walk?5:6,st=walk?{color:'#667085',weight:w,dashArray:'2 9'}:{color:'#1a73e8',weight:w};
  const name=walk?'Zu Fuß':((MODES[l.mode]||'')+' '+(l.routeShortName||l.displayName||'')).trim();
  const from=l.from&&l.from.name&&l.from.name!=='START'?l.from.name:'Start',to=l.to&&l.to.name&&l.to.name!=='END'?l.to.name:'Ziel';
  let line=null;
  if(l.legGeometry&&l.legGeometry.points){const pts=decode(l.legGeometry.points,l.legGeometry.precision||6);
   if(pts.length>1){line=L.polyline(pts,Object.assign({bubblingMouseEvents:false},st)).addTo(routeLayer);line.on('click',()=>sel(i))}}
  const stops=l.intermediateStops||[];
  const d=document.createElement('button');d.type='button';d.className='leg';
  d.innerHTML='<b>'+esc(name)+'</b> · '+esc(from)+' → '+esc(to)+'<small>'+(l.startTime?clock(l.startTime)+' → '+clock(l.endTime)+' · ':'')+fmt(l.duration)+(l.realTime?' · Echtzeit':'')+(stops.length?' · '+stops.length+' Zwischenhalte':'')+'</small>';
  const det=document.createElement('div');det.className='stops';det.hidden=true;
  const rows=[[from,l.startTime]].concat(stops.map(x=>[x.name,x.departure||x.arrival])).concat([[to,l.endTime]]);
  rows.forEach(r=>{const x=document.createElement('div');x.textContent=(r[1]?clock(r[1])+'  ':'')+r[0];det.appendChild(x)});
  d.onclick=()=>sel(i);$('legs').appendChild(d);$('legs').appendChild(det);items.push({d,det,line,w});
 });
 if(routeLayer.getLayers().length)fit(routeLayer);
 curJ=j;TLINES=items.map(i=>i.line);$('tgo').hidden=false;$('stop').hidden=false;
 $('duration').textContent=fmt(j.duration);$('distance').textContent=' · '+(j.transfers||0)+' Umstiege · '+clock(j.startTime)+'–'+clock(j.endTime);
}
function decode(s,p){let i=0,lat=0,lng=0,o=[],f=Math.pow(10,p);while(i<s.length){let b,sh=0,r=0;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);lat+=(r&1)?~(r>>1):(r>>1);sh=0;r=0;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);lng+=(r&1)?~(r>>1):(r>>1);o.push([lat/f,lng/f])}return o}

// Live-Standort während der Navigation
function track(){if(watchId!==null||!navigator.geolocation)return;
 watchId=navigator.geolocation.watchPosition(showUser,()=>{},{enableHighAccuracy:true,maximumAge:5000});$('stop').hidden=false}
function stopTrack(){if(watchId!==null&&navigator.geolocation)navigator.geolocation.clearWatch(watchId);watchId=null;$('stop').hidden=true;endNavUI()}
$('start').onclick=()=>{unlockVoice();startRoute()};
$('stop').onclick=endRoute;
$('close').onclick=e=>{e.preventDefault();stopTrack();$('sheet').classList.remove('open');$('routeOutput').classList.remove('open');clearRoute();$('options').innerHTML='';if(marker){map.removeLayer(marker);marker=null}place=null};

// Rezensionen (lokal)
function readReviews(){try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){return{}}}
function renderReviews(){const list=readReviews()[placeKey]||[];
 const avg=list.length?list.reduce((a,r)=>a+ +r.rating,0)/list.length:0;
 $('reviewSummary').textContent=list.length?'★ '+avg.toFixed(1).replace('.',',')+' / 5 · '+list.length+' Rezensionen':'Noch keine Rezensionen';
 $('reviews').innerHTML='';
 list.slice().reverse().forEach(r=>{const el=document.createElement('article');el.className='review';el.textContent=(r.name||'Anonym')+' · '+'★'.repeat(r.rating)+'☆'.repeat(5-r.rating)+' — '+r.text;$('reviews').appendChild(el)})}
$('reviewForm').onsubmit=e=>{e.preventDefault();const all=readReviews();
 (all[placeKey]||(all[placeKey]=[])).push({name:$('reviewer').value.trim(),rating:+$('rating').value,text:$('reviewText').value.trim(),date:new Date().toISOString()});
 try{localStorage.setItem(STORE,JSON.stringify(all))}catch(x){}
 $('reviewText').value='';renderReviews()};

// ===== Handy-Anzeige =====
function padB(){const s=$('sheet');return s.classList.contains('open')?Math.min(innerHeight*.6,s.offsetHeight)+24:40}
$('grab').onclick=()=>$('sheet').classList.toggle('min');
function syncSheet(){document.documentElement.style.setProperty('--sheetH',$('sheet').classList.contains('open')&&innerWidth<=600?$('sheet').offsetHeight+'px':'0px');map.invalidateSize()}
if(window.ResizeObserver)new ResizeObserver(syncSheet).observe($('sheet'));
addEventListener('resize',syncSheet);addEventListener('orientationchange',()=>setTimeout(syncSheet,300));
// ===== Live-Navigation (Echtzeit) =====
let NAV=null,follow=true,lastReroute=0,spoken={},voiceOn=true,lock=null;
const dirs={left:'links','slight left':'leicht links','sharp left':'scharf links',right:'rechts','slight right':'leicht rechts','sharp right':'scharf rechts',straight:'geradeaus',uturn:'wenden'};
const arrows={left:'↰','slight left':'↖','sharp left':'↰',right:'↱','slight right':'↗','sharp right':'↱',straight:'↑',uturn:'⤶'};
function instr(s){const m=s.maneuver||{},t=m.type,d=dirs[m.modifier]||'',n=s.name?(' auf '+s.name):'';
 if(t==='depart')return'Starte'+n;if(t==='arrive')return'Ziel erreicht';
 if(t==='roundabout'||t==='rotary'||t==='roundabout turn')return'Im Kreisverkehr die '+(m.exit||1)+'. Ausfahrt nehmen'+n;
 if(t==='fork')return'An der Gabelung '+d+' halten'+n;if(t==='merge')return'Einfädeln'+n;
 if(t==='on ramp')return'Auffahrt nehmen'+n;if(t==='off ramp')return'Ausfahrt nehmen'+n;
 if(t==='end of road')return'Am Ende der Straße '+d+' abbiegen'+n;
 if(t==='new name'||t==='continue'||m.modifier==='straight')return'Geradeaus weiter'+n;
 if(m.modifier==='uturn')return'Bitte wenden';
 return d?d.charAt(0).toUpperCase()+d.slice(1)+' abbiegen'+n:'Weiter'+n}
const fd=m=>m<1000?(Math.round(m/10)*10)+' m':(m/1000).toFixed(1).replace('.',',')+' km';
function prep(rt){const c=rt.geometry.coordinates.map(a=>[a[1],a[0]]),cum=[0];
 for(let i=1;i<c.length;i++)cum.push(cum[i-1]+L.latLng(c[i-1]).distanceTo(L.latLng(c[i])));
 const steps=[].concat(...rt.legs.map(l=>l.steps));let k=0;
 const at=steps.map(s=>{const ml=L.latLng(s.maneuver.location[1],s.maneuver.location[0]);let best=k,bd=1e12;
  for(let i=k;i<c.length;i++){const d=ml.distanceTo(L.latLng(c[i]));if(d<bd){bd=d;best=i}}k=best;return cum[best]});
 return{c,cum,steps,at,total:cum[cum.length-1]||1,dur:rt.duration}}
function project(p,r){const kx=111320*Math.cos(p.lat*Math.PI/180),ky=110540;let bd=1e12,bp=0;
 for(let i=0;i<r.c.length-1;i++){const a=r.c[i],b=r.c[i+1],ax=(a[1]-p.lng)*kx,ay=(a[0]-p.lat)*ky,bx=(b[1]-p.lng)*kx,by=(b[0]-p.lat)*ky,dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;
  let t=l2?-(ax*dx+ay*dy)/l2:0;t=Math.max(0,Math.min(1,t));const d=Math.hypot(ax+t*dx,ay+t*dy);
  if(d<bd){bd=d;bp=r.cum[i]+t*(r.cum[i+1]-r.cum[i])}}
 return{dist:bd,prog:bp}}
let unlocked=false,voice=null;
function pickVoice(){if(!window.speechSynthesis)return;const v=speechSynthesis.getVoices();voice=v.find(x=>x.lang==='de-DE')||v.find(x=>x.lang&&x.lang.indexOf('de')===0)||null}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
// iOS erlaubt Sprache erst, nachdem sie einmal direkt per Fingertipp gestartet wurde
function unlockVoice(always){if(!window.speechSynthesis||!voiceOn||(unlocked&&!always))return;
 const u=new SpeechSynthesisUtterance(unlocked?'Sprachführung an':'Sprachführung ist aktiv');u.lang='de-DE';if(voice)u.voice=voice;
 speechSynthesis.resume();speechSynthesis.speak(u);unlocked=true}
function say(t){if(!voiceOn||!window.speechSynthesis||!unlocked)return;
 const busy=speechSynthesis.speaking||speechSynthesis.pending;if(busy)speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';if(voice)u.voice=voice;
 setTimeout(()=>{speechSynthesis.resume();speechSynthesis.speak(u)},busy?150:0)}
function drawNavRoute(rt){if(routeLayer)map.removeLayer(routeLayer);routeLayer=L.geoJSON(rt.geometry,{style:{color:'#1a73e8',weight:7}}).addTo(map)}
function beginNav(rt,end){stopTrack();if(!navigator.geolocation)return;
 NAV={r:prep(rt),end:{lat:end.lat,lng:end.lng},rt:rt};follow=true;spoken={};
 document.body.classList.add('navigating');$('navTop').hidden=false;$('navBot').hidden=false;$('sheet').classList.remove('open');
 $('navText').textContent='Standort wird ermittelt …';$('navDist').textContent='';
 if(navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>lock=l).catch(()=>{});
 watchId=navigator.geolocation.watchPosition(navUpdate,()=>{$('navText').textContent='GPS-Signal fehlt …'},{enableHighAccuracy:true,maximumAge:1000,timeout:20000})}
function navUpdate(pos){showUser(pos);if(!NAV)return;const p=userLoc;
 if(follow)map.setView([p.lat,p.lng],Math.max(map.getZoom(),17),{animate:true});
 const pr=project(p,NAV.r),rest=NAV.r.total-pr.prog,toEnd=L.latLng(p.lat,p.lng).distanceTo(L.latLng(NAV.end.lat,NAV.end.lng));
 if(toEnd<30||rest<20){$('navIcon').textContent='⚑';$('navDist').textContent='';$('navText').textContent='Du hast dein Ziel erreicht';say('Du hast dein Ziel erreicht');
  if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;return}
 if(pr.dist>45&&Date.now()-lastReroute>8000){lastReroute=Date.now();reroute(p)}
 let j=NAV.r.at.findIndex((a,i)=>i>0&&a>pr.prog+8);if(j<0)j=NAV.r.steps.length-1;
 const s=NAV.r.steps[j],dn=Math.max(0,NAV.r.at[j]-pr.prog),txt=instr(s);
 $('navDist').textContent=fd(dn);$('navText').textContent=txt;$('navIcon').textContent=s.maneuver.type==='arrive'?'⚑':(arrows[s.maneuver.modifier]||'↑');
 const secs=NAV.r.dur*(rest/NAV.r.total);
 $('navEta').textContent=clock(Date.now()+secs*1000)+' Uhr';$('navRest').textContent=' · '+fmt(secs)+' · '+fd(rest);
 if(dn<350&&dn>120&&!spoken[j+'a']){spoken[j+'a']=1;say('In '+fd(dn)+', '+txt)}
 else if(dn<=120&&!spoken[j+'b']){spoken[j+'b']=1;say(txt)}}
function reroute(p){$('navText').textContent='Route wird neu berechnet …';
 fetch(profiles[mode]+p.lng+','+p.lat+';'+NAV.end.lng+','+NAV.end.lat+'?overview=full&geometries=geojson&steps=true').then(r=>r.json()).then(d=>{
  if(!NAV||!d.routes||!d.routes.length)return;NAV.rt=d.routes[0];NAV.r=prep(d.routes[0]);spoken={};drawNavRoute(d.routes[0]);say('Route neu berechnet')}).catch(()=>{})}
function endNavUI(){NAV=null;TN=null;document.body.classList.remove('navigating');$('navTop').hidden=true;$('navBot').hidden=true;if(lock){lock.release().catch(()=>{});lock=null}
 if(window.speechSynthesis)speechSynthesis.cancel();if(place)$('sheet').classList.add('open')}
map.on('dragstart',()=>{if(NAV||TN)follow=false});
$('navEnd').onclick=endRoute;
function endRoute(){stopTrack();clearRoute();$('options').innerHTML='';$('routeOutput').classList.remove('open');msg('')}
$('navVoice').onclick=()=>{voiceOn=!voiceOn;$('navVoice').textContent=voiceOn?'🔊':'🔇';if(voiceOn)unlockVoice(true);if(!voiceOn&&window.speechSynthesis)speechSynthesis.cancel()};

// ===== ÖPNV-Navigation (live, nach Klick auf "Navigation starten") =====
let TN=null,curJ=null,TLINES=[];
const legName=l=>l.mode==='WALK'?'Zu Fuß':((MODES[l.mode]||'')+' '+(l.routeShortName||l.displayName||'')).trim();
const nmOf=(x,d)=>x&&x.name&&x.name!=='END'&&x.name!=='START'?x.name:d;
const ICON={WALK:'🚶',BUS:'🚌',TRAM:'🚋',SUBWAY:'🚇',FERRY:'⛴'};
function beginTransitNav(j){
 stopTrack();if(!navigator.geolocation||!j)return;
 const legs=(j.legs||[]).map(l=>{
  const pts=l.legGeometry&&l.legGeometry.points?decode(l.legGeometry.points,l.legGeometry.precision||6):[],cum=[0];
  for(let k=1;k<pts.length;k++)cum.push(cum[k-1]+L.latLng(pts[k-1]).distanceTo(L.latLng(pts[k])));
  const r={c:pts,cum,total:cum[cum.length-1]||1},ok=pts.length>1;
  const stops=ok?(l.intermediateStops||[]).filter(x=>x.lat!=null).map(x=>({name:x.name,prog:project({lat:x.lat,lng:x.lon},r).prog})):[];
  return{l,r,ok,stops,walk:l.mode==='WALK'}});
 if(!legs.length)return;
 TN={j,legs,idx:0,boarded:false,shown:-1};follow=true;spoken={};
 document.body.classList.add('navigating');$('navTop').hidden=false;$('navBot').hidden=false;$('sheet').classList.remove('open');
 $('navIcon').textContent='🚶';$('navText').textContent='Standort wird ermittelt …';$('navDist').textContent='';
 if(navigator.wakeLock)navigator.wakeLock.request('screen').then(x=>lock=x).catch(()=>{});
 watchId=navigator.geolocation.watchPosition(tnUpdate,()=>{$('navText').textContent='GPS-Signal fehlt …'},{enableHighAccuracy:true,maximumAge:1000,timeout:20000})}
function tnUpdate(pos){
 showUser(pos);if(!TN)return;const p=userLoc,ll=L.latLng(p.lat,p.lng),legs=TN.legs;
 if(follow)map.setView([p.lat,p.lng],Math.max(map.getZoom(),16),{animate:true});
 let g=legs[TN.idx];const dTo=x=>x&&x.lat!=null?ll.distanceTo(L.latLng(x.lat,x.lon)):1e9;
 if(dTo(g.l.to)<(g.walk?25:45)){
  if(TN.idx===legs.length-1){$('navIcon').textContent='⚑';$('navDist').textContent='';$('navText').textContent='Du hast dein Ziel erreicht';say('Du hast dein Ziel erreicht');
   if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;return}
  TN.idx++;TN.boarded=false;g=legs[TN.idx]}
 const i=TN.idx,nxt=legs[i+1],l=g.l,to=nmOf(l.to,'Ziel'),from=nmOf(l.from,'Start');
 let icon=ICON[l.mode]||'🚆',dist,txt;
 if(g.walk){const pr=g.ok?project(p,g.r):null,rem=pr&&pr.dist<80?g.r.total-pr.prog:dTo(l.to);
  icon='🚶';dist=fd(rem);txt='Gehe zu '+to+(nxt?' · weiter mit '+legName(nxt.l)+' um '+clock(nxt.l.startTime):'')}
 else{
  const pr=g.ok?project(p,g.r):{dist:1e9,prog:0},fromD=dTo(l.from);
  if(!TN.boarded&&pr.dist<40&&pr.prog>60)TN.boarded=true;
  if(TN.boarded){const left=g.stops.filter(s=>s.prog>pr.prog+30).length+1;
   dist='noch '+left+(left===1?' Halt':' Halte');txt='Fahre mit '+legName(l)+' bis '+to+(left===1?' · jetzt aussteigen':'');
   if(left===1&&!spoken['o'+i]){spoken['o'+i]=1;say('Nächster Halt: '+to+'. Bitte aussteigen.')}}
  else if(fromD>60){icon='🚶';dist=fd(fromD);txt='Gehe zu Haltestelle '+from+' · '+legName(l)+' um '+clock(l.startTime)}
  else{const mins=Math.round((new Date(l.startTime)-Date.now())/60000),late=l.scheduledStartTime?Math.round((new Date(l.startTime)-new Date(l.scheduledStartTime))/60000):0;
   dist=mins>0?'in '+mins+' Min.':'jetzt';
   txt='Warte auf '+legName(l)+(l.headsign?' Richtung '+l.headsign:'')+' · '+clock(l.startTime)+(late>0?' (+'+late+' Min. Verspätung)':'')+(l.realTime?' · Echtzeit':'')}
 }
 $('navIcon').textContent=icon;$('navDist').textContent=dist;$('navText').textContent=txt;
 if(TN.shown!==i){TN.shown=i;TLINES.forEach((ln,k)=>ln&&ln.setStyle(k===i?{weight:10,opacity:1}:{weight:6,opacity:.35}));say(txt)}
 const secs=Math.max(0,(new Date(TN.j.endTime)-Date.now())/1000);
 $('navEta').textContent=clock(TN.j.endTime)+' Uhr';$('navRest').textContent=' · noch '+fmt(secs)+(nxt?' · danach '+legName(nxt.l):'')}
$('tgo').onclick=()=>{unlockVoice();beginTransitNav(curJ)};
</script></body></html>
