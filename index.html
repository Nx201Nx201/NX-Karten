<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NX-Karten</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"><style>
:root{--ui:#fff;--soft:#f1f3f4;--tx:#202124;--muted:#667085;--blue:#1a73e8;--line:#e4e7ec;--shadow:0 6px 22px #0002}*{box-sizing:border-box}html,body{height:100%;margin:0;font:15px/1.4 system-ui,sans-serif;color:var(--tx)}#map{position:fixed;inset:0}.top{position:fixed;z-index:1000;top:14px;left:14px;right:82px;max-width:460px}.search{height:48px;display:flex;align-items:center;gap:10px;padding:0 15px;border-radius:26px;background:var(--ui);box-shadow:var(--shadow)}.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--tx);font:inherit}.brand{position:fixed;z-index:1001;right:14px;top:14px;padding:10px 14px;border-radius:18px;background:var(--ui);box-shadow:var(--shadow);font-size:20px;font-weight:850;letter-spacing:.08em;color:var(--blue)}.results{display:none;margin-top:8px;max-height:42vh;overflow:auto;background:var(--ui);border-radius:16px;box-shadow:var(--shadow)}.results.open{display:block}.result{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--tx);padding:11px 14px;text-align:left;font:inherit;cursor:pointer}.result small{display:block;color:var(--muted);margin-top:3px}.floats{position:fixed;right:14px;bottom:18px;z-index:1000;display:grid;gap:9px}.float{width:44px;height:44px;border:0;border-radius:50%;background:var(--ui);box-shadow:var(--shadow);font-size:19px;cursor:pointer}.sheet{display:none;position:fixed;z-index:1100;left:50%;bottom:12px;transform:translateX(-50%);width:min(560px,calc(100vw - 20px));max-height:82vh;overflow:auto;padding:17px;background:var(--ui);border-radius:22px;box-shadow:var(--shadow)}.sheet.open{display:block}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.head h2{margin:0;font-size:20px}.sub{color:var(--muted);font-size:13px;margin:3px 0 12px}.close{position:relative;z-index:5;border:0;background:transparent;color:var(--muted);font-size:25px;line-height:1;cursor:pointer;padding:4px 8px;pointer-events:auto}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:7px 0 13px}.tab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:9px 12px;font:inherit;cursor:pointer}.tab.active{border-color:var(--blue);color:var(--blue);font-weight:700}.panel{display:none}.panel.active{display:block}.field{display:block;margin:10px 0}.field span{display:block;margin-bottom:4px;color:var(--muted);font-size:13px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--ui);color:var(--tx);font:inherit}.field textarea{min-height:75px;resize:vertical}.row{display:flex;align-items:center;gap:9px;margin:8px 0}.buttons{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.btn{border:1px solid var(--line);border-radius:999px;background:var(--soft);color:var(--tx);padding:9px 13px;font:inherit;cursor:pointer}.btn.primary,.btn.selected{background:var(--blue);border-color:var(--blue);color:#fff}.status{color:var(--muted);font-size:13px;margin:8px 0}.status.error{color:#b42318}.output{display:none;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.output.open{display:block}.output strong{font-size:20px}.options{display:flex;gap:8px;overflow:auto;margin:8px 0}.option{min-width:145px;border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:9px;text-align:left;color:var(--tx);cursor:pointer}.option small{display:block;color:var(--muted)}.leg{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.review-summary{padding:10px;border-radius:12px;background:var(--soft);margin-bottom:10px}.stars{color:#e99b00;letter-spacing:1px}.review{border-bottom:1px solid var(--line);padding:10px 0}.muted{color:var(--muted);font-size:12px}[hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{--ui:#292b2e;--soft:#383a3e;--tx:#eceff1;--muted:#abb0b8;--line:#4a4d52;--blue:#8ab4f8;--shadow:0 8px 26px #0008}}
</style></head><body>
<div id="map"></div><div class="top"><div class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Ort oder Adresse suchen" aria-label="Ort oder Adresse suchen" autocomplete="off"></div><div class="results" id="results"></div></div><div class="brand">NX</div><div class="floats"><button class="float" id="sat" title="Satellitenkarte">🛰</button><button class="float" id="loc" title="Mein Standort">◎</button></div>
<section class="sheet" id="sheet" aria-live="polite"><div class="head"><h2 id="placeName">Ort</h2><button class="close" id="close" type="button" aria-label="Schließen">×</button></div><div id="placeAddress" class="sub"></div><div class="tabs"><button class="tab active" data-panel="routePanel">Route</button><button class="tab" data-panel="reviewsPanel">Rezensionen</button><button class="tab" data-panel="infoPanel">Info</button></div>
<div class="panel active" id="routePanel"><label class="row"><input type="radio" name="origin" value="device" checked> Mein Gerätestandort</label><label class="row"><input type="radio" name="origin" value="address"> Startadresse eingeben</label><label class="field" id="fromWrap" hidden><span>Startadresse</span><input id="from" placeholder="Straße, Ort"></label><label class="field"><span>Zieladresse</span><input id="to" placeholder="Adresse oder Ort"></label><div class="buttons"><button class="btn selected" data-mode="car">Auto</button><button class="btn" data-mode="bike">Rad</button><button class="btn" data-mode="foot">Zu Fuß</button><button class="btn" data-mode="transit">ÖPNV</button></div><button class="btn primary" id="start">Route starten</button><button class="btn" id="stop" hidden>Navigation beenden</button><div class="output" id="routeOutput"><strong id="duration"></strong> <span id="distance"></span><div class="status" id="status"></div><div class="options" id="options"></div><div id="legs"></div></div></div>
<div class="panel" id="reviewsPanel"><div id="reviewSummary" class="review-summary"></div><div id="reviews"></div><h3>Rezension schreiben</h3><form id="reviewForm"><label class="field"><span>Name (optional)</span><input id="reviewer" maxlength="50" placeholder="Anonym"></label><label class="field"><span>Sterne</span><select id="rating"><option value="5">★★★★★ – Sehr gut</option><option value="4">★★★★☆ – Gut</option><option value="3">★★★☆☆ – In Ordnung</option><option value="2">★★☆☆☆ – Nicht gut</option><option value="1">★☆☆☆☆ – Schlecht</option></select></label><label class="field"><span>Deine Rezension</span><textarea id="reviewText" maxlength="1000" required></textarea></label><button class="btn primary">Speichern</button></form><p class="muted">Nur lokal in diesem Browser gespeichert.</p></div><div class="panel" id="infoPanel"><p id="info"></p></div></section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script><script>
const $=id=>document.getElementById(id);const map=L.map('map',{zoomControl:false}).setView([20,0],2);L.control.zoom({position:'bottomleft'}).addTo(map);const osm=L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap-Mitwirkende'}).addTo(map);const satellite=L.layerGroup([L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'}),L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19})]);let sat=false,place=null,marker=null,userLoc=null,userMarker=null,routeLayer=null,mode='car',watchId=null,reviewKey='';$('sat').onclick=()=>{sat=!sat;if(sat){map.removeLayer(osm);satellite.addTo(map)}else{map.removeLayer(satellite);osm.addTo(map)}};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setPlace(lat,lon,name,bounds){place={lat,lon,name};reviewKey=lat.toFixed(4)+','+lon.toFixed(4);if(marker)map.removeLayer(marker);marker=L.marker([lat,lon]).addTo(map);$('placeName').textContent=name.split(',')[0]||'Ort';$('placeAddress').textContent=name;$('to').value=name;$('info').textContent=name+' · '+lat.toFixed(5)+', '+lon.toFixed(5);renderReviews();$('sheet').classList.add('open');if(bounds)map.fitBounds([[+bounds[0],+bounds[2]],[+bounds[1],+bounds[3]]],{maxZoom:16,paddingBottomRight:[0,330]});else map.setView([lat,lon],15)}
function geocode(text,multiple=false){return fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit='+(multiple?6:1)+'&accept-language=de&q='+encodeURIComponent(text)).then(r=>{if(!r.ok)throw Error('Adresssuche nicht erreichbar');return r.json()}).then(rows=>{if(multiple){$('results').innerHTML='';if(!rows.length)$('results').innerHTML='<div class="result">Keine Treffer.</div>';rows.forEach(p=>{const b=document.createElement('button');b.className='result';b.innerHTML='<b>'+esc(p.display_name.split(',')[0])+'</b><small>'+esc(p.display_name)+'</small>';b.onclick=()=>{$('results').classList.remove('open');$('search').blur();setPlace(+p.lat,+p.lon,p.display_name,p.boundingbox)};$('results').appendChild(b)});$('results').classList.add('open');return null}if(!rows.length)throw Error('Adresse nicht gefunden: '+text);return{lat:+rows[0].lat,lng:+rows[0].lon,name:rows[0].display_name}})}let timer;$('search').addEventListener('input',()=>{clearTimeout(timer);const v=$('search').value.trim();if(v.length<2){$('results').classList.remove('open');return}timer=setTimeout(()=>geocode(v,true).catch(()=>{$('results').innerHTML='<div class="result">Suche nicht erreichbar</div>';$('results').classList.add('open')}),450)});$('search').addEventListener('keydown',e=>{if(e.key==='Enter')$('results').querySelector('button')?.click()});map.on('click',e=>{fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=de&lat='+e.latlng.lat+'&lon='+e.latlng.lng).then(r=>r.json()).then(p=>setPlace(e.latlng.lat,e.latlng.lng,p.display_name||'Kartenauswahl')).catch(()=>setPlace(e.latlng.lat,e.latlng.lng,'Kartenauswahl'))});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===b.dataset.panel))});document.querySelectorAll('[name="origin"]').forEach(r=>r.onchange=()=>{$('fromWrap').hidden=document.querySelector('[name="origin"]:checked').value!=='address'});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('selected',x===b))});
function locate(){return new Promise((resolve,reject)=>{if(!window.isSecureContext){reject(Error('Standortzugriff braucht HTTPS. Öffne https://nx-karten.vercel.app und nicht die GitHub-Dateivorschau.'));return}if(!navigator.geolocation){reject(Error('Dieser Browser unterstützt keine Standortbestimmung.'));return}navigator.geolocation.getCurrentPosition(p=>{userLoc={lat:p.coords.latitude,lng:p.coords.longitude};if(userMarker)userMarker.setLatLng([userLoc.lat,userLoc.lng]);else userMarker=L.circleMarker([userLoc.lat,userLoc.lng],{radius:8,color:'#fff',weight:3,fillColor:'#1a73e8',fillOpacity:1}).addTo(map);map.setView([userLoc.lat,userLoc.lng],15);$('status').classList.remove('error');$('status').textContent='Standort gefunden';resolve(userLoc)},e=>{const msg=e.code===1?'Standortberechtigung verweigert. Erlaube den Zugriff für diese Website in den Browser-Einstellungen.':e.code===2?'Gerätestandort nicht verfügbar. Aktiviere GPS/Standortdienste und versuche es erneut.':'Standortsuche abgelaufen. Bitte erneut versuchen.';$('status').classList.add('error');$('status').textContent=msg;reject(Error(msg))},{enableHighAccuracy:true,timeout:30000,maximumAge:0})})}$('loc').onclick=()=>locate().catch(()=>{});
function clearRoute(){if(routeLayer){map.removeLayer(routeLayer);routeLayer=null}$('options').innerHTML='';$('legs').innerHTML=''}const fmt=s=>{let m=Math.max(1,Math.round((+s||0)/60));return m<60?m+' Min.':Math.floor(m/60)+' Std. '+m%60+' Min.'};const profiles={car:'https://router.project-osrm.org/route/v1/driving/',bike:'https://routing.openstreetmap.de/routed-bike/route/v1/driving/',foot:'https://routing.openstreetmap.de/routed-foot/route/v1/driving/'};
async function startRoute(){clearRoute();$('routeOutput').hidden=false;$('duration').textContent='Route wird gesucht …';$('distance').textContent='';$('status').textContent='';$('status').classList.remove('error');try{const start=document.querySelector('[name="origin"]:checked').value==='device'?await locate():await geocode($('from').value.trim());const end=await geocode($('to').value.trim());if(mode==='transit'){const p=new URLSearchParams({fromPlace:start.lat+','+start.lng,toPlace:end.lat+','+end.lng,time:new Date().toISOString(),language:'de',detailedLegs:'true',detailedTransfers:'true',numItineraries:'5',timetableView:'true',searchWindow:'3600',realtimeMode:'REALTIME',transitModes:'TRANSIT'});const r=await fetch('https://api.transitous.org/api/v6/plan?'+p);if(!r.ok)throw Error('ÖPNV-Routenserver nicht erreichbar');const d=await r.json();if(!d.itineraries?.length)throw Error('Keine ÖPNV-Verbindung gefunden');$('options').innerHTML='';d.itineraries.forEach((j,i)=>{const b=document.createElement('button');b.className='option';b.innerHTML='<b>'+new Date(j.startTime).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' → '+new Date(j.endTime).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+'</b><small>'+fmt(j.duration)+' · '+(j.transfers||0)+' Umstiege</small>';b.onclick=()=>drawTransit(j);$('options').appendChild(b)});drawTransit(d.itineraries[0]);return}const r=await fetch(profiles[mode]+start.lng+','+start.lat+';'+end.lng+','+end.lat+'?overview=full&geometries=geojson');if(!r.ok)throw Error('Routenserver HTTP '+r.status);const d=await r.json();if(!d.routes?.length)throw Error('Keine Route gefunden');const rt=d.routes[0];routeLayer=L.geoJSON(rt.geometry,{style:{color:'#1a73e8',weight:6}}).addTo(map);map.fitBounds(routeLayer.getBounds(),{padding:[50,280]});$('duration').textContent=fmt(rt.duration);$('distance').textContent=' · '+(rt.distance/1000).toFixed(1).replace('.',',')+' km'}catch(e){$('duration').textContent='';$('status').textContent=e.message;$('status').classList.add('error')}}
function drawTransit(j){clearRoute();(j.legs||[]).forEach(l=>{const d=document.createElement('div');d.className='leg';d.textContent=(l.displayName||l.routeShortName||l.mode)+': '+(l.from?.name||'Start')+' → '+(l.to?.name||'Ziel')+' · '+fmt(l.duration)+(l.realTime?' · Echtzeit':'');$('legs').appendChild(d);if(l.legGeometry?.points){const points=decode(l.legGeometry.points,l.legGeometry.precision||6);if(points.length>1){if(!routeLayer)routeLayer=L.layerGroup();routeLayer.addLayer(L.polyline(points,{color:'#2678e8',weight:6}))}}});if(routeLayer){routeLayer.addTo(map);map.fitBounds(routeLayer.getBounds(),{padding:[50,280]})}$('duration').textContent=fmt(j.duration);$('distance').textContent=' · '+(j.transfers||0)+' Umstiege'}function decode(s,p){let i=0,lat=0,lng=0,o=[],f=10**p;while(i<s.length){let b,sh=0,r=0;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);lat+=(r&1)?~(r>>1):(r>>1);sh=0;r=0;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);lng+=(r&1)?~(r>>1):(r>>1);o.push([lat/f,lng/f])}return o}
$('start').onclick=startRoute;$('close').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(watchId!==null&&navigator.geolocation)navigator.geolocation.clearWatch(watchId);watchId=null;navActive=false;$('stop').hidden=true;$('sheet').classList.remove('open');$('routeOutput').hidden=true;clearRoute();if(marker){map.removeLayer(marker);marker=null}place=null});$('stop').onclick=()=>{if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;navActive=false;$('stop').hidden=true};
const reviewKey='nx-karten-reviews-v1';function readReviews(){try{return JSON.parse(localStorage.getItem(reviewKey)||'{}')}catch(e){return{}}}function renderReviews(){const entries=readReviews()[placeKey]||[];const avg=entries.length?entries.reduce((a,r)=>a+ +r.rating,0)/entries.length:0;$('reviewSummary').textContent=entries.length?`★ ${avg.toFixed(1)} / 5 · ${entries.length} Rezensionen`:'Noch keine Rezensionen';$('reviews').innerHTML='';entries.slice().reverse().forEach(r=>{const el=document.createElement('article');el.className='review';el.textContent=`${r.name||'Anonym'} · ${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)} — ${r.text}`;$('reviews').appendChild(el)})}$('reviewForm').onsubmit=e=>{e.preventDefault();const all=readReviews();(all[placeKey]||(all[placeKey]=[])).push({name:$('reviewer').value.trim(),rating:+$('rating').value,text:$('reviewText').value.trim(),date:new Date().toISOString()});localStorage.setItem(reviewKey,JSON.stringify(all));$('reviewText').value='';renderReviews()};
</script></body></html>
