<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NX-Karten</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--ui:#fff;--ui2:#f1f3f4;--tx:#202124;--tx2:#5f6368;--ac:#1a73e8;--sh:0 2px 10px rgba(0,0,0,.28)}
@media (prefers-color-scheme:dark){:root{--ui:#2a2b2e;--ui2:#3a3c40;--tx:#e8eaed;--tx2:#a0a4aa;--ac:#8ab4f8;--sh:0 2px 10px rgba(0,0,0,.6)}}
*{box-sizing:border-box}html,body{height:100%;margin:0;color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}#map{position:fixed;inset:0}
.top{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);max-width:440px;z-index:1000}.bar{display:flex;align-items:center;background:var(--ui);border-radius:26px;box-shadow:var(--sh);padding:0 14px;height:48px;gap:10px}.bar input{flex:1;border:0;background:none;font:inherit;color:var(--tx);outline:none;min-width:0}
.list{margin-top:6px;background:var(--ui);border-radius:16px;box-shadow:var(--sh);max-height:50vh;overflow:auto;display:none}.list.on{display:block}.row{display:block;padding:10px 14px;cursor:pointer;border:0;background:none;width:100%;text-align:left;font:inherit;color:var(--tx)}.row:hover,.row:focus-visible{background:var(--ui2);outline:none}.row small{display:block;color:var(--tx2)}
.fabs{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:10px;z-index:1000;transition:bottom .2s}.fabs.up{bottom:calc(env(safe-area-inset-bottom,0px) + 300px)}.fab{width:44px;height:44px;border-radius:50%;border:0;background:var(--ui);box-shadow:var(--sh);color:var(--tx);font-size:20px;cursor:pointer}
.fab:focus-visible,.btn:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1001;background:var(--ui);border-radius:22px 22px 0 0;box-shadow:0 -2px 14px rgba(0,0,0,.3);padding:16px 18px calc(env(safe-area-inset-bottom,0px) + 18px);max-width:520px;margin:0 auto;transform:translateY(110%);transition:transform .25s}.sheet.on{transform:none}.sheet h2{margin:0;font-size:19px;padding-right:28px}.sheet p{margin:2px 0 12px;color:var(--tx2)}.acts{display:flex;gap:8px;flex-wrap:wrap}.mode-row{margin:10px 0}.btn{border:1px solid var(--ui2);background:var(--ui2);color:var(--tx);border-radius:20px;padding:9px 16px;font:inherit;cursor:pointer}.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn[aria-pressed="true"]{background:var(--ac);color:#fff}.eta{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--ui2)}.eta.on{display:block}.eta b{font-size:22px}.x{position:absolute;right:12px;top:10px;border:0;background:none;color:var(--tx2);font-size:24px;cursor:pointer}.legs{max-height:26vh;overflow:auto;margin-top:8px;color:var(--tx2);font-size:13px}.note{font-size:12px;color:var(--tx2);margin-top:6px}.choices{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:4px}.choice{white-space:nowrap;border:1px solid var(--ui2);border-radius:14px;background:var(--ui2);color:var(--tx);padding:8px 11px;text-align:left;cursor:pointer;min-width:130px}.choice[aria-pressed="true"]{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}.choice small{display:block;color:var(--tx2)}
</style>
</head>
<body>
<div id="map"></div>
<div class="top"><div class="bar"><span aria-hidden="true">Suchen</span><input id="q" type="search" placeholder="Ort oder Adresse suchen" autocomplete="off" aria-label="Suche"></div><div class="list" id="list"></div></div>
<div class="fabs" id="fabs"><button class="fab" id="sat" title="Satellit ein/aus" aria-label="Satellit ein oder aus">🛰</button><button class="fab" id="street" title="Street View am Kartenausschnitt öffnen" aria-label="Street View öffnen">👁</button><button class="fab" id="loc" title="Mein Standort" aria-label="Mein Standort">◎</button></div>
<div class="sheet" id="sheet" role="dialog" aria-live="polite"><button class="x" id="close" aria-label="Schließen">×</button><h2 id="sn"></h2><p id="sd"></p>
<div class="acts mode-row" aria-label="Verkehrsmittel auswählen"><button class="btn" data-m="car" aria-pressed="true">Auto</button><button class="btn" data-m="bike" aria-pressed="false">Rad</button><button class="btn" data-m="foot" aria-pressed="false">Zu Fuß</button><button class="btn" data-m="opnv" aria-pressed="false">ÖPNV</button></div>
<div class="acts"><button class="btn p" id="go">Route starten</button></div><div class="note">ÖPNV weltweit, soweit Fahrplandaten verfügbar sind. Echtzeitdaten sind nicht für jede Verbindung verfügbar.</div>
<div class="eta" id="eta"><b id="et"></b> <span id="ed" style="color:var(--tx2)"></span><div class="choices" id="choices"></div><div class="legs" id="legs"></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
var map=L.map('map',{zoomControl:false}).setView([51.45,6.8],10);L.control.zoom({position:'bottomleft'}).addTo(map);
var osm=L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap-Mitwirkende'}).addTo(map);
var satGroup=L.layerGroup([L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Bilder © Esri, Maxar, Earthstar Geographics'}),L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19})]);
var sat=false;document.getElementById('sat').onclick=function(){sat=!sat;if(sat){map.removeLayer(osm);satGroup.addTo(map)}else{map.removeLayer(satGroup);osm.addTo(map)}};
var $=function(i){return document.getElementById(i)},mark=null,me=null,meMark=null,route=null,target=null,mode='car',requestId=0,transitJourneys=[],planParams=null;
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function clearRoute(){if(route){map.removeLayer(route);route=null}$('legs').innerHTML=''}
function formatDuration(seconds){var m=Math.max(1,Math.round((Number(seconds)||0)/60));return m<60?m+' Min.':Math.floor(m/60)+' Std. '+(m%60)+' Min.'}
function decodePolyline(str,precision){var points=[],index=0,lat=0,lng=0,factor=Math.pow(10,precision||6);while(index<str.length){var shift=0,result=0,b;do{if(index>=str.length)throw Error('Ungültige Liniengeometrie');b=str.charCodeAt(index++)-63;result|=(b&31)<<shift;shift+=5}while(b>=32);lat+=(result&1)?~(result>>1):(result>>1);shift=0;result=0;do{if(index>=str.length)throw Error('Ungültige Liniengeometrie');b=str.charCodeAt(index++)-63;result|=(b&31)<<shift;shift+=5}while(b>=32);lng+=(result&1)?~(result>>1):(result>>1);points.push([lat/factor,lng/factor])}return points}
function openStreetView(){var p=target||[map.getCenter().lat,map.getCenter().lng];window.open('https://www.google.com/maps/@?api=1&map_action=pano&viewpoint='+encodeURIComponent(p[0]+','+p[1]),'_blank','noopener,noreferrer')}$('street').onclick=openStreetView;
var tm=null,q=$('q'),list=$('list');q.addEventListener('input',function(){clearTimeout(tm);var t=q.value.trim();if(t.length<2){list.classList.remove('on');return}tm=setTimeout(function(){search(t)},400)});q.addEventListener('keydown',function(e){if(e.key==='Enter'){var f=list.querySelector('button');if(f)f.click()}});
function search(t){fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=7&accept-language=de&q='+encodeURIComponent(t)).then(function(r){if(!r.ok)throw Error();return r.json()}).then(function(r){list.innerHTML='';if(!r.length)list.innerHTML='<div class="row">Keine Treffer.</div>';r.forEach(function(p){var b=document.createElement('button');b.className='row';var parts=p.display_name.split(', ');b.innerHTML='<b>'+esc(parts[0])+'</b><small>'+esc(parts.slice(1,4).join(', '))+'</small>';b.onclick=function(){list.classList.remove('on');q.blur();show(+p.lat,+p.lon,p.display_name,p.boundingbox)};list.appendChild(b)});list.classList.add('on')}).catch(function(){list.innerHTML='<div class="row">Suche nicht erreichbar. Prüfe deine Verbindung.</div>';list.classList.add('on')})}
function show(lat,lon,name,bb){target=[lat,lon];requestId++;clearRoute();transitJourneys=[];$('choices').innerHTML='';$('eta').classList.remove('on');if(mark)map.removeLayer(mark);mark=L.marker(target).addTo(map);var parts=name.split(', ');$('sn').textContent=parts[0];$('sd').textContent=parts.slice(1,5).join(', ');$('sheet').classList.add('on');$('fabs').classList.add('up');if(bb)map.fitBounds([[+bb[0],+bb[2]],[+bb[1],+bb[3]]],{maxZoom:17,paddingBottomRight:[0,300]});else map.setView(target,16)}
map.on('click',function(e){list.classList.remove('on');fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=de&zoom=18&lat='+e.latlng.lat+'&lon='+e.latlng.lng).then(function(r){return r.json()}).then(function(p){show(e.latlng.lat,e.latlng.lng,p.display_name||e.latlng.lat.toFixed(5)+', '+e.latlng.lng.toFixed(5))}).catch(function(){show(e.latlng.lat,e.latlng.lng,e.latlng.lat.toFixed(5)+', '+e.latlng.lng.toFixed(5))})});
$('close').onclick=function(){$('sheet').classList.remove('on');$('fabs').classList.remove('up');requestId++;if(mark){map.removeLayer(mark);mark=null}clearRoute()};
function locate(cb){map.once('locationfound',function(e){me=e.latlng;if(meMark)map.removeLayer(meMark);meMark=L.circleMarker(me,{radius:8,color:'#fff',weight:3,fillColor:'#1a73e8',fillOpacity:1}).addTo(map);if(cb)cb()});map.once('locationerror',function(){$('eta').classList.add('on');$('et').textContent='';$('ed').textContent='Standort nicht verfügbar. Erlaube den Standortzugriff im Browser.'});map.locate({enableHighAccuracy:true})}$('loc').onclick=function(){locate(function(){map.setView(me,15)})};
var EP={car:'https://router.project-osrm.org/route/v1/driving/',bike:'https://routing.openstreetmap.de/routed-bike/route/v1/driving/',foot:'https://routing.openstreetmap.de/routed-foot/route/v1/driving/'};
function renderJourney(index,id){if(id!==requestId)return;var itin=transitJourneys[index];if(!itin)return;clearRoute();var newRoute=L.layerGroup(),legRows=[];(itin.legs||[]).forEach(function(leg){var transit=!['WALK','BIKE','CAR'].includes(leg.mode),label=transit?(leg.displayName||leg.routeShortName||leg.mode):'Zu Fuß',from=leg.from&&leg.from.name||'Start',to=leg.to&&leg.to.name||'Ziel';var realtime=leg.realTime?' · Echtzeit':'',cancelled=leg.cancelled?' · fällt aus':'';legRows.push('<div><b>'+esc(label)+'</b>: '+esc(from)+' → '+esc(to)+' · '+formatDuration(leg.duration)+esc(realtime+cancelled)+(leg.from&&leg.from.departure?' · Abfahrt '+new Date(leg.from.departure).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'')+'</div>');var g=leg.legGeometry;if(g&&g.points){try{var coords=decodePolyline(g.points,g.precision||6);if(coords.length>1){var raw=String(leg.routeColor||'').replace('#',''),color=/^[0-9a-f]{6}$/i.test(raw)?'#'+raw:'#1a73e8';newRoute.addLayer(L.polyline(coords,{color:transit?color:'#1a73e8',weight:transit?6:4,opacity:.9,dashArray:transit?null:'6 6'}))}}catch(e){console.warn('Liniengeometrie für Abschnitt übersprungen',e)}}});if(id!==requestId)return;if(newRoute.getLayers().length)newRoute.addTo(map);route=newRoute;$('legs').innerHTML=legRows.join('');var secs=Number(itin.duration)||Math.max(0,(Date.parse(itin.endTime)-Date.parse(itin.startTime))/1000);$('et').textContent=formatDuration(secs);$('ed').textContent=(itin.transfers||0)+' Umstiege · '+new Date(itin.startTime).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+'–'+new Date(itin.endTime).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});if(itin.legs&&itin.legs.some(function(l){return l.realTime}))$('ed').textContent+=' · Echtzeitdaten';if(newRoute.getLayers().length)map.fitBounds(newRoute.getBounds(),{paddingTopLeft:[30,90],paddingBottomRight:[30,300]});document.querySelectorAll('.choice').forEach(function(b,i){b.setAttribute('aria-pressed',String(i===index))})}
function loadMoreTransit(id){if(!planParams)return;var p=new URLSearchParams(planParams);p.set('pageCursor',planParams.nextPageCursor);fetch('https://api.transitous.org/api/v6/plan?'+p.toString(),{headers:{Accept:'application/json'}}).then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(function(d){if(id!==requestId)return;planParams.nextPageCursor=d.nextPageCursor||'';var added=d.itineraries||[];if(!added.length){$('ed').textContent='Keine weiteren Abfahrten gefunden.';return}var start=transitJourneys.length;transitJourneys=transitJourneys.concat(added);renderChoices(id,start);}).catch(function(e){if(id===requestId){$('ed').textContent='Weitere Verbindungen konnten nicht geladen werden.';console.error(e)}})}
function renderChoices(id,startAt){var box=$('choices');if(startAt===0)box.innerHTML='';transitJourneys.forEach(function(it,i){if(i<startAt)return;var b=document.createElement('button');b.className='choice';b.setAttribute('aria-pressed','false');var dep=it.startTime?new Date(it.startTime).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'Abfahrt';var arr=it.endTime?new Date(it.endTime).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'';var live=(it.legs||[]).some(function(l){return l.realTime});b.innerHTML='<b>'+esc(dep)+' → '+esc(arr)+'</b><small>'+formatDuration(it.duration)+' · '+(it.transfers||0)+' Umstiege'+(live?' · Echtzeit':'')+'</small>';b.onclick=function(){renderJourney(i,id)};box.appendChild(b)});if(planParams&&planParams.nextPageCursor){var more=document.createElement('button');more.className='choice';more.innerHTML='<b>Weitere Verbindungen</b><small>Abfahrten nachladen</small>';more.onclick=function(){more.disabled=true;more.innerHTML='<b>Lädt …</b>';loadMoreTransit(id)};box.appendChild(more)}}
function calcTransit(id){var params=new URLSearchParams({fromPlace:me.lat+','+me.lng,toPlace:target[0]+','+target[1],time:new Date().toISOString(),language:'de',detailedLegs:'true',detailedTransfers:'true',numItineraries:'5',timetableView:'true',searchWindow:'3600',realtimeMode:'REALTIME',transitModes:'TRANSIT',joinInterlinedLegs:'false'});planParams=params;fetch('https://api.transitous.org/api/v6/plan?'+params.toString(),{headers:{Accept:'application/json'}}).then(function(r){if(!r.ok)throw Error('Transitous HTTP '+r.status);return r.json()}).then(function(d){if(id!==requestId)return;transitJourneys=(d&&d.itineraries)||[];planParams.nextPageCursor=d&&d.nextPageCursor||'';if(!transitJourneys.length){$('et').textContent='';$('ed').textContent='Keine Verbindung gefunden. Diese Strecke oder Region hat möglicherweise keine Fahrplandaten.';$('choices').innerHTML='';return}renderChoices(id,0);renderJourney(0,id)}).catch(function(e){if(id!==requestId)return;$('et').textContent='';$('ed').textContent='Verbindungen konnten nicht geladen werden. Prüfe deine Internetverbindung und versuche es erneut.';console.error('Transitous routing error:',e)})}
function calc(){if(!me||!target)return;var id=++requestId;clearRoute();$('eta').classList.add('on');$('et').textContent='Route wird gesucht …';$('ed').textContent='';$('choices').innerHTML='';if(mode==='opnv'){calcTransit(id);return}fetch(EP[mode]+me.lng+','+me.lat+';'+target[1]+','+target[0]+'?overview=full&geometries=geojson').then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(function(d){if(id!==requestId)return;if(!d.routes||!d.routes.length){$('et').textContent='';$('ed').textContent='Keine Route gefunden.';return}var r=d.routes[0];route=L.geoJSON(r.geometry,{style:{color:'#1a73e8',weight:6,opacity:.9}}).addTo(map);map.fitBounds(route.getBounds(),{paddingTopLeft:[30,90],paddingBottomRight:[30,300]});$('et').textContent=formatDuration(r.duration);$('ed').textContent=r.distance>=1000?(r.distance/1000).toFixed(1).replace('.',',')+' km':Math.round(r.distance)+' m'}).catch(function(e){if(id!==requestId)return;$('et').textContent='';$('ed').textContent='Routenserver nicht erreichbar. Prüfe die Verbindung oder versuche es später erneut.';console.error(e)})}
$('go').onclick=function(){$('eta').classList.add('on');$('et').textContent='Standort wird ermittelt …';$('ed').textContent='';clearRoute();if(me)calc();else locate(calc)};
document.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){mode=b.dataset.m;document.querySelectorAll('[data-m]').forEach(function(o){o.setAttribute('aria-pressed',o===b)});clearRoute();$('choices').innerHTML='';$('et').textContent='';$('ed').textContent='Verkehrsmittel ausgewählt. Tippe auf „Route starten“.')}});
</script>
</body>
</html>
